<!DOCTYPE html>
<html lang="zh-HK">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NBA 球隊隨機抽籤 & 陣容對決</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {

    background: #f0f2f5;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100vh;

    padding: 20px 0;

    color: #333;

}

.container {

    width: 90%;

    max-width: 480px;

    background: white;

    padding: 30px 25px;

    border-radius: 20px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.1);

    text-align: center;

}

h1 {

    font-size: 1.3rem;

    color: #555;

    margin-bottom: 20px;

}


/* =====================================================
ROOM
===================================================== */

.room-section {

    background: #f8fafc;

    border: 1px solid #e2e8f0;

    border-radius: 14px;

    padding: 15px;

    margin-bottom: 20px;

}

.room-title {

    font-weight: 700;

    color: #334155;

    margin-bottom: 8px;

}

.room-code {

    font-size: 1.8rem;

    font-weight: 900;

    letter-spacing: 4px;

    color: #006bb6;

    margin: 8px 0;

}

.role-text {

    font-size: .95rem;

    color: #64748b;

    margin-bottom: 8px;

}

.room-count {

    font-size: .9rem;

    font-weight: 700;

    color: #475569;

    margin-bottom: 12px;

}

.room-actions {

    display: flex;

    gap: 8px;

}

.room-input {

    flex: 1;

    min-width: 0;

    padding: 10px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;

    outline: none;

    text-align: center;

    font-weight: 600;

    letter-spacing: 1px;

}

.room-btn {

    border: none;

    color: white;

    background: #006bb6;

    border-radius: 8px;

    padding: 10px 12px;

    font-weight: 700;

    cursor: pointer;

}

.room-btn:disabled {

    background: #cbd5e1;

    cursor: not-allowed;

}

.leave-btn {

    width: 100%;

    margin-top: 10px;

    background: #ef4444;

}

.status-text {

    margin-top: 10px;

    font-size: .9rem;

    color: #64748b;

}


/* =====================================================
WAITING
===================================================== */

.turn-banner {

    display: none;

    margin-bottom: 15px;

    padding: 11px;

    border-radius: 10px;

    background: #eff6ff;

    color: #1d4ed8;

    font-weight: 700;

}

.turn-banner.waiting {

    background: #f1f5f9;

    color: #64748b;

}


/* =====================================================
DISPLAY
===================================================== */

.display-card {

    background: #fff;

    border: 2px solid #e2e8f0;

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;

    min-height: 230px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    overflow: hidden;

    transition: .3s;

}

.display-card.active {

    border-color: #006bb6;

    box-shadow:
        0 0 15px rgba(0,107,182,.15);

}

.display-card.locked {

    background: #f8fafc;

    opacity: .72;

}

.team-node {

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

}

.team-node.show {

    display: flex;

}

.team-node.pop {

    animation:
        popIn .08s ease-out forwards;

}

@keyframes popIn {

    from {
        transform: scale(.9);
    }

    to {
        transform: scale(1);
    }

}

.team-logo {

    width: 95px;

    height: 95px;

    margin-bottom: 12px;

    object-fit: contain;

}

.team-zh {

    font-size: 2.6rem;

    font-weight: 800;

    color: #1a202c;

}

.team-en {

    font-size: 1rem;

    color: #718096;

}

.pending-node {

    opacity: .5;

}


/* =====================================================
ROLL
===================================================== */

.btn-roll {

    width: 100%;

    background: #121212;

    color: white;

    border: none;

    padding: 14px 24px;

    font-size: 1.1rem;

    font-weight: 600;

    border-radius: 12px;

    cursor: pointer;

    margin-bottom: 30px;

}

.btn-roll:hover:not(:disabled) {

    background: #333;

}

.btn-roll:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

    box-shadow: none;

}


/* =====================================================
TEAMS
===================================================== */

.divider {

    height: 1px;

    background: #e2e8f0;

    margin: 10px 0 25px;

}

.teams-container {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 20px;

}

.team-box {

    flex: 1;

    background: #f8fafc;

    padding: 15px 10px;

    border-radius: 12px;

    border: 1px solid #edf2f7;

    transition: .2s;

}

.team-box.active-team {

    border-color: #006bb6;

    box-shadow:
        0 0 0 2px rgba(0,107,182,.08);

}

.team-box.locked {

    opacity: .65;

}

.team-title {

    font-weight: 700;

    font-size: 1.1rem;

    color: #2d3748;

    margin-bottom: 15px;

}

.position-row {

    display: flex;

    align-items: center;

    margin-bottom: 10px;

}

.pos-label {

    width: 42px;

    text-align: right;

    font-weight: 700;

    font-size: .95rem;

    color: #4a5568;

    padding-right: 4px;

}

.player-input {

    flex: 1;

    min-width: 0;

    padding: 6px 10px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;

    font-size: .9rem;

    outline: none;

    background: white;

}

.player-input:focus {

    border-color: #006bb6;

    box-shadow:
        0 0 0 2px rgba(0,107,182,.15);

}

.player-input:disabled {

    background: #e9eef5;

    color: #94a3b8;

    cursor: not-allowed;

}


/* =====================================================
ACTION
===================================================== */

.action-btns {

    display: flex;

    gap: 10px;

}

.btn-create {

    flex: 3;

    background: #10b981;

    color: white;

    border: none;

    padding: 14px 18px;

    font-size: 1.05rem;

    font-weight: 600;

    border-radius: 12px;

    cursor: pointer;

}

.btn-create:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

}

.btn-clear {

    flex: 1;

    background: #ef4444;

    color: white;

    border: none;

    padding: 14px 12px;

    font-size: 1rem;

    font-weight: 600;

    border-radius: 12px;

    cursor: pointer;

}

.btn-clear:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

}


/* =====================================================
OUTPUT
===================================================== */

.output-section {

    margin-top: 20px;

    display: none;

    text-align: left;

    background: #f1f5f9;

    padding: 15px;

    border-radius: 12px;

    border: 1px solid #cbd5e1;

}

.output-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 8px;

}

.output-status {

    color: #10b981;

    font-weight: 700;

}

.btn-copy {

    background: #e2e8f0;

    color: #334155;

    border: none;

    padding: 4px 10px;

    border-radius: 6px;

    cursor: pointer;

}

.output-text {

    width: 100%;

    height: 90px;

    border: none;

    background: transparent;

    resize: none;

    outline: none;

    line-height: 1.4;

}


/* =====================================================
MOBILE
===================================================== */

@media (max-width:420px) {

    .container {

        width: 94%;

        padding: 25px 15px;

    }

    .teams-container {

        gap: 8px;

    }

    .team-box {

        padding: 12px 6px;

    }

    .pos-label {

        width: 38px;

        font-size: .85rem;

    }

    .player-input {

        font-size: .82rem;

        padding: 6px 7px;

    }

}

</style>

</head>


<body>


<div class="container">


<h1>
NBA 球隊隨機抽籤
</h1>


<!-- =====================================================
ROOM
===================================================== -->

<div class="room-section">

    <div class="room-title">
        聯機房間
    </div>

    <div
        class="room-code"
        id="roomCode"
    >
        未加入
    </div>

    <div
        class="role-text"
        id="roleText"
    >
        請建立或加入房間
    </div>

    <div
        class="room-count"
        id="roomCount"
    >
        👥 0 / 2
    </div>

    <div class="room-actions">

        <button
            class="room-btn"
            id="createRoomBtn"
            onclick="createRoom()"
        >
            建立房間
        </button>

        <input
            id="joinRoomInput"
            class="room-input"
            placeholder="房間碼"
            maxlength="6"
        >

        <button
            class="room-btn"
            id="joinRoomBtn"
            onclick="joinRoom()"
        >
            加入
        </button>

    </div>

    <button
        class="room-btn leave-btn"
        id="leaveRoomBtn"
        onclick="leaveRoom()"
        style="display:none;"
    >
        退出房間
    </button>

    <div
        class="status-text"
        id="roomStatus"
    >
        尚未連接
    </div>

</div>


<div
    class="turn-banner"
    id="turnBanner"
>
</div>


<!-- =====================================================
DISPLAY
===================================================== -->

<div
    class="display-card locked"
    id="displayCard"
>

    <!-- Pending -->
    <div
        class="team-node show pending-node"
        id="node-pending"
    >

        <img
            src="https://a.espncdn.com/i/teamlogos/leagues/500/nba.png"
            class="team-logo"
            alt="NBA"
        >

        <div class="team-zh">
            待定
        </div>

        <div class="team-en">
            Pending
        </div>

    </div>

</div>


<button
    class="btn-roll"
    id="rollBtn"
    disabled
    onclick="handleRollButton()"
>
    等待第二位玩家
</button>


<div class="divider"></div>


<!-- =====================================================
TEAMS
===================================================== -->

<div class="teams-container">


<div
    class="team-box"
    id="teamBoxA"
>

    <div class="team-title">
        A隊
    </div>

    <div class="position-row">
        <span class="pos-label">PG-</span>
        <input
            class="player-input"
            id="a_pg"
            disabled
        >
    </div>

    <div class="position-row">
        <span class="pos-label">SG-</span>
        <input
            class="player-input"
            id="a_sg"
            disabled
        >
    </div>

    <div class="position-row">
        <span class="pos-label">SF-</span>
        <input
            class="player-input"
            id="a_sf"
            disabled
        >
    </div>

    <div class="position-row">
        <span class="pos-label">PF-</span>
        <input
            class="player-input"
            id="a_pf"
            disabled
        >
    </div>

    <div class="position-row">
        <span class="pos-label">C-</span>
        <input
            class="player-input"
            id="a_c"
            disabled
        >
    </div>

</div>


<div
    class="team-box"
    id="teamBoxB"
>

    <div class="team-title">
        B隊
    </div>

    <div class="position-row">
        <span class="pos-label">PG-</span>
        <input
            class="player-input"
            id="b_pg"
            disabled
        >
    </div>

    <div class="position-row">
        <span class="pos-label">SG-</span>
        <input
            class="player-input"
            id="b_sg"
            disabled
        >
    </div>

    <div class="position-row">
        <span class="pos-label">SF-</span>
        <input
            class="player-input"
            id="b_sf"
            disabled
        >
    </div>

    <div class="position-row">
        <span class="pos-label">PF-</span>
        <input
            class="player-input"
            id="b_pf"
            disabled
        >
    </div>

    <div class="position-row">
        <span class="pos-label">C-</span>
        <input
            class="player-input"
            id="b_c"
            disabled
        >
    </div>

</div>


</div>


<div class="action-btns">

    <button
        class="btn-create"
        id="createBtn"
        onclick="generatePrompt()"
        disabled
    >
        創建球隊完成
    </button>

    <button
        class="btn-clear"
        id="clearBtn"
        onclick="clearLocalGame()"
        disabled
    >
        清空
    </button>

</div>


<div
    class="output-section"
    id="outputSection"
>

    <div class="output-header">

        <span class="output-status">
            已生成文案！
        </span>

        <button
            class="btn-copy"
            onclick="copyText()"
        >
            複製文案
        </button>

    </div>

    <textarea
        class="output-text"
        id="outputText"
        readonly
    ></textarea>

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://yafuniflixhbkdcqnqfz.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhZnVuaWZsaXhoYmtkY3FucWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjM0ODQsImV4cCI6MjEwMjc5OTQ4NH0.IBxTIxuHXDBT6OhyTtMxPsigZgx5oca7ZjFHS7h6Zyg";

const {
    createClient
} = window.supabase;

const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
NBA
========================================================= */

const nbaTeams = [

["老鷹","Atlanta Hawks","atl"],
["塞爾提克","Boston Celtics","bos"],
["籃網","Brooklyn Nets","bkn"],
["黃蜂","Charlotte Hornets","cha"],
["公牛","Chicago Bulls","chi"],
["騎士","Cleveland Cavaliers","cle"],
["獨行俠","Dallas Mavericks","dal"],
["金塊","Denver Nuggets","den"],
["活塞","Detroit Pistons","det"],
["勇士","Golden State Warriors","gs"],
["火箭","Houston Rockets","hou"],
["遛馬","Indiana Pacers","ind"],
["快艇","LA Clippers","lac"],
["湖人","Los Angeles Lakers","lal"],
["灰熊","Memphis Grizzlies","mem"],
["熱火","Miami Heat","mia"],
["公鹿","Milwaukee Bucks","mil"],
["灰狼","Minnesota Timberwolves","min"],
["鵜鶘","New Orleans Pelicans","no"],
["尼克","New York Knicks","ny"],
["雷霆","Oklahoma City Thunder","okc"],
["魔術","Orlando Magic","orl"],
["七六人","Philadelphia 76ers","phi"],
["太陽","Phoenix Suns","phx"],
["開拓者","Portland Trail Blazers","por"],
["國王","Sacramento Kings","sac"],
["馬刺","San Antonio Spurs","sas"],
["猛龍","Toronto Raptors","tor"],
["爵士","Utah Jazz","utah"],
["奇才","Washington Wizards","was"]

].map(
    team => ({
        zh: team[0],
        en: team[1],
        logo:
            `https://a.espncdn.com/i/teamlogos/nba/500/${team[2]}.png`
    })
);


/* =========================================================
DOM
========================================================= */

const roomCode =
    document.getElementById("roomCode");

const roleText =
    document.getElementById("roleText");

const roomCount =
    document.getElementById("roomCount");

const roomStatus =
    document.getElementById("roomStatus");

const rollBtn =
    document.getElementById("rollBtn");

const displayCard =
    document.getElementById("displayCard");

const turnBanner =
    document.getElementById("turnBanner");

const createBtn =
    document.getElementById("createBtn");

const clearBtn =
    document.getElementById("clearBtn");

const leaveRoomBtn =
    document.getElementById("leaveRoomBtn");

const outputSection =
    document.getElementById("outputSection");

const outputText =
    document.getElementById("outputText");

const allInputs =
    [...document.querySelectorAll(".player-input")];


/* =========================================================
TEAM DOM
========================================================= */

const teamNodes = [];

nbaTeams.forEach(
    (team,index) => {

        const node =
            document.createElement("div");

        node.className =
            "team-node";

        node.id =
            `team-node-${index}`;

        node.innerHTML = `

            <img
                src="${team.logo}"
                class="team-logo"
                alt="${team.en}"
            >

            <div class="team-zh">
                ${team.zh}
            </div>

            <div class="team-en">
                ${team.en}
            </div>

        `;

        displayCard.appendChild(node);

        teamNodes.push(node);

    }
);


/* =========================================================
PLAYER ID
========================================================= */

let playerToken =
    localStorage.getItem(
        "nba_player_token"
    );

if (!playerToken) {

    playerToken =
        crypto.randomUUID();

    localStorage.setItem(
        "nba_player_token",
        playerToken
    );

}


/* =========================================================
ROOM STATE
========================================================= */

let currentRoomCode =
    localStorage.getItem(
        "nba_room_code"
    );

let myRole =
    localStorage.getItem(
        "nba_my_role"
    );

let gameState = null;

let realtimeChannel = null;

let isRolling = false;


/* =========================================================
DEFAULT STATE
========================================================= */

function getPlayerCount() {

    if (!gameState) {

        return 0;

    }

    return Number(
        gameState.player_count || 0
    );

}


/* =========================================================
ROOM UI
========================================================= */

function updateRoomUI() {

    if (!currentRoomCode) {

        roomCode.textContent =
            "未加入";

        roleText.textContent =
            "請建立或加入房間";

        roomCount.textContent =
            "👥 0 / 2";

        leaveRoomBtn.style.display =
            "none";

        return;

    }


    roomCode.textContent =
        currentRoomCode;

    roleText.textContent =
        myRole === "A"
            ? "你係 A隊（房主）"
            : "你係 B隊";

    roomCount.textContent =
        `👥 ${getPlayerCount()} / 2`;

    leaveRoomBtn.style.display =
        "block";

}


/* =========================================================
WAITING
========================================================= */

function isRoomReady() {

    return (
        gameState &&
        getPlayerCount() >= 2
    );

}


/* =========================================================
RENDER
========================================================= */

function renderState() {

    if (!gameState) {

        resetGameUI();

        return;

    }


    updateRoomUI();

    renderPlayers();

    renderTurn();

    renderButtons();

    renderTeam();

}


/* =========================================================
RESET
========================================================= */

function resetGameUI() {

    displayCard.classList.add("locked");

    turnBanner.style.display =
        "block";

    turnBanner.className =
        "turn-banner waiting";

    turnBanner.textContent =
        "等待加入房間";

    rollBtn.disabled =
        true;

    rollBtn.textContent =
        "等待第二位玩家";

    createBtn.disabled =
        true;

    clearBtn.disabled =
        true;

    allInputs.forEach(
        input => {

            input.value = "";

            input.disabled = true;

        }
    );


    showPending();

}


/* =========================================================
PENDING
========================================================= */

function showPending() {

    teamNodes.forEach(
        node => {

            node.classList.remove(
                "show",
                "pop"
            );

        }
    );


    const pending =
        document.getElementById(
            "node-pending"
        );

    if (pending) {

        pending.classList.add(
            "show"
        );

    }

}


/* =========================================================
TEAM DISPLAY
========================================================= */

function renderTeam() {

    if (!isRoomReady()) {

        showPending();

        return;

    }


    const selected =
        gameState.selected_team_index;


    if (
        selected === null ||
        selected === undefined
    ) {

        showPending();

        return;

    }


    const index =
        Number(selected);


    teamNodes.forEach(
        node => {

            node.classList.remove(
                "show",
                "pop"
            );

        }
    );


    if (teamNodes[index]) {

        teamNodes[index]
            .classList.add("show");

    }


    displayCard.classList.remove(
        "locked"
    );

}


/* =========================================================
PLAYERS
========================================================= */

function renderPlayers() {

    const positions =
        ["pg","sg","sf","pf","c"];


    for (
        const team of ["a","b"]
    ) {

        for (
            const pos of positions
        ) {

            const input =
                document.getElementById(
                    `${team}_${pos}`
                );

            input.value =
                gameState[team]?.[pos] || "";

            input.disabled = true;

        }

    }


    if (!isRoomReady()) {

        return;

    }


    if (
        gameState.phase !== "input"
    ) {

        return;

    }


    if (
        gameState.turn !== myRole
    ) {

        return;

    }


    const team =
        myRole.toLowerCase();


    positions.forEach(
        pos => {

            const input =
                document.getElementById(
                    `${team}_${pos}`
                );


            if (
                !gameState[team]?.[pos]
            ) {

                input.disabled = false;

            }

        }
    );

}


/* =========================================================
TURN
========================================================= */

function renderTurn() {

    turnBanner.style.display =
        "block";


    if (!isRoomReady()) {

        turnBanner.className =
            "turn-banner waiting";

        turnBanner.textContent =
            "⏳ 等待第二位玩家加入房間";

        return;

    }


    turnBanner.className =
        "turn-banner";


    if (
        gameState.phase === "done"
    ) {

        turnBanner.textContent =
            "🏆 所有球員已完成，可以創建文案";

        return;

    }


    if (
        gameState.turn === myRole
    ) {

        if (
            gameState.phase === "roll"
        ) {

            turnBanner.textContent =
                `🟢 到你 (${myRole}隊)！請抽取球隊`;

        } else {

            turnBanner.textContent =
                `🟢 ${myRole}隊，請選擇位置並輸入球員`;

        }

    } else {

        turnBanner.textContent =
            `🔴 ${gameState.turn}隊回合，請等待`;

    }

}


/* =========================================================
BUTTONS
========================================================= */

function renderButtons() {

    /* 未滿 2 人 */
    if (!isRoomReady()) {

        rollBtn.disabled = true;

        rollBtn.textContent =
            "等待第二位玩家";

        displayCard.classList.add(
            "locked"
        );

        createBtn.disabled = true;

        return;

    }


    /* 遊戲完成 */
    if (
        gameState.phase === "done"
    ) {

        rollBtn.disabled = true;

        rollBtn.textContent =
            "本局已完成";

        createBtn.disabled =
            Number(
                gameState.completed_count || 0
            ) < 10;

        return;

    }


    /* Roll */
    if (
        gameState.phase === "roll"
    ) {

        rollBtn.disabled =
            gameState.turn !== myRole ||
            isRolling;

        rollBtn.textContent =
            gameState.turn === myRole
                ? "隨機抽取球隊"
                : "等待對方抽取";

        createBtn.disabled = true;

        return;

    }


    /* Input */
    if (
        gameState.phase === "input"
    ) {

        const team =
            myRole.toLowerCase();

        const hasText =
            allInputs.some(
                input =>
                    input.id.startsWith(
                        `${team}_`
                    ) &&
                    !input.disabled &&
                    input.value.trim()
            );


        rollBtn.disabled =
            gameState.turn !== myRole ||
            !hasText;

        rollBtn.textContent =
            gameState.turn === myRole
                ? "提交球員"
                : "等待對方輸入";

        createBtn.disabled = true;

    }

}


/* =========================================================
INPUT
========================================================= */

allInputs.forEach(
    input => {

        input.addEventListener(
            "input",
            () => {

                renderButtons();

            }
        );


        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    if (
                        input.value.trim()
                    ) {

                        submitCurrentInput(
                            input
                        );

                    }

                }

            }
        );

    }
);


/* =========================================================
CREATE ROOM
========================================================= */

async function createRoom() {

    try {

        roomStatus.textContent =
            "正在建立房間...";


        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "create_nba_room",
                {
                    p_token:
                        playerToken
                }
            );


        if (error) {

            throw error;

        }


        currentRoomCode =
            data.room_code;

        myRole =
            data.role;

        gameState =
            data.state;


        localStorage.setItem(
            "nba_room_code",
            currentRoomCode
        );

        localStorage.setItem(
            "nba_my_role",
            myRole
        );


        subscribeToRoom();

        renderState();


        roomStatus.textContent =
            "房間已建立，等待第二位玩家加入";

    } catch (error) {

        console.error(error);

        roomStatus.textContent =
            "建立失敗";

        alert(
            "建立房間失敗：\n" +
            error.message
        );

    }

}


/* =========================================================
JOIN
========================================================= */

async function joinRoom() {

    const input =
        document.getElementById(
            "joinRoomInput"
        );


    const code =
        input.value
            .trim()
            .toUpperCase();


    if (
        code.length !== 6
    ) {

        alert(
            "請輸入 6 位房間碼"
        );

        return;

    }


    try {

        roomStatus.textContent =
            "正在加入房間...";


        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "join_nba_room",
                {
                    p_code: code,

                    p_token:
                        playerToken
                }
            );


        if (error) {

            throw error;

        }


        currentRoomCode =
            data.room_code;

        myRole =
            data.role;

        gameState =
            data.state;


        localStorage.setItem(
            "nba_room_code",
            currentRoomCode
        );

        localStorage.setItem(
            "nba_my_role",
            myRole
        );


        subscribeToRoom();

        renderState();


        roomStatus.textContent =
            "已加入房間，遊戲開始！";

    } catch (error) {

        console.error(error);

        roomStatus.textContent =
            "加入失敗";

        alert(
            "加入房間失敗：\n" +
            error.message
        );

    }

}


/* =========================================================
REALTIME
========================================================= */

function subscribeToRoom() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

    }


    realtimeChannel =
        supabaseClient
            .channel(
                `nba-room-${currentRoomCode}`
            )
            .on(
                "postgres_changes",
                {
                    event: "*",

                    schema: "public",

                    table: "nba_rooms",

                    filter:
                        `room_code=eq.${currentRoomCode}`
                },

                payload => {

                    console.log(
                        "ROOM UPDATE",
                        payload
                    );


                    if (
                        payload.eventType ===
                        "DELETE"
                    ) {

                        handleRoomDeleted();

                        return;

                    }


                    if (
                        payload.new &&
                        payload.new.game_state
                    ) {

                        gameState =
                            payload.new.game_state;


                        renderState();

                    }

                }
            )
            .subscribe(
                status => {

                    console.log(
                        "Realtime:",
                        status
                    );

                }
            );

}


/* =========================================================
REFRESH
========================================================= */

async function refreshRoom() {

    if (
        !currentRoomCode
    ) {

        return;

    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "get_nba_room",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken
                }
            );


        if (error) {

            throw error;

        }


        gameState =
            data.state;

        myRole =
            data.role;


        renderState();

    } catch (error) {

        console.error(
            "refreshRoom:",
            error
        );

    }

}


/* =========================================================
ROLL
========================================================= */

async function handleRollButton() {

    if (
        !gameState ||
        !isRoomReady()
    ) {

        return;

    }


    if (
        gameState.phase === "roll"
    ) {

        await startRolling();

        return;

    }


    if (
        gameState.phase === "input"
    ) {

        const team =
            myRole.toLowerCase();


        const input =
            allInputs.find(
                item =>
                    item.id.startsWith(
                        `${team}_`
                    ) &&
                    !item.disabled &&
                    item.value.trim()
            );


        if (!input) {

            alert(
                "請先輸入球員"
            );

            return;

        }


        await submitCurrentInput(
            input
        );

    }

}


/* =========================================================
ROLL
========================================================= */

async function startRolling() {

    if (
        isRolling ||
        !gameState
    ) {

        return;

    }


    if (
        gameState.phase !== "roll"
    ) {

        return;

    }


    if (
        gameState.turn !== myRole
    ) {

        return;

    }


    isRolling = true;

    rollBtn.disabled = true;


    displayCard.classList.add(
        "active"
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "roll_nba_room",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken
                }
            );


        if (error) {

            throw error;

        }


        const finalIndex =
            Number(
                data.state
                    .selected_team_index
            );


        await animateRoll(
            finalIndex
        );


        gameState =
            data.state;


        renderState();

    } catch (error) {

        console.error(error);

        alert(
            error.message
        );

        await refreshRoom();

    }


    isRolling = false;

    displayCard.classList.remove(
        "active"
    );

    renderState();

}


/* =========================================================
ANIMATION
========================================================= */

function animateRoll(
    finalIndex
) {

    return new Promise(
        resolve => {

            let count = 0;

            const maxSteps = 35;

            let delay = 20;

            let lastIndex = -1;


            function step() {

                let index;


                if (
                    count ===
                    maxSteps - 1
                ) {

                    index =
                        finalIndex;

                } else {

                    do {

                        index =
                            Math.floor(
                                Math.random() *
                                nbaTeams.length
                            );

                    } while (
                        index === lastIndex
                    );

                }


                teamNodes.forEach(
                    node => {

                        node.classList.remove(
                            "show",
                            "pop"
                        );

                    }
                );


                const node =
                    teamNodes[index];


                if (node) {

                    node.classList.add(
                        "show",
                        "pop"
                    );

                }


                lastIndex =
                    index;

                count++;


                if (
                    count >= maxSteps
                ) {

                    resolve();

                    return;

                }


                if (
                    count > 25
                ) {

                    delay += 30;

                } else if (
                    count > 20
                ) {

                    delay += 15;

                }


                setTimeout(
                    step,
                    delay
                );

            }


            step();

        }
    );

}


/* =========================================================
SUBMIT PLAYER
========================================================= */

async function submitCurrentInput(
    input
) {

    if (
        !gameState ||
        !isRoomReady()
    ) {

        return;

    }


    if (
        gameState.phase !== "input"
    ) {

        return;

    }


    if (
        gameState.turn !== myRole
    ) {

        return;

    }


    const team =
        myRole.toLowerCase();


    if (
        !input.id.startsWith(
            `${team}_`
        )
    ) {

        return;

    }


    const position =
        input.id.split("_")[1];


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "請輸入球員名字"
        );

        return;

    }


    input.disabled = true;


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "fill_nba_player",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken,

                    p_position:
                        position,

                    p_player_name:
                        name
                }
            );


        if (error) {

            throw error;

        }


        gameState =
            data.state;


        renderState();

    } catch (error) {

        console.error(error);

        alert(
            error.message
        );

        await refreshRoom();

    }

}


/* =========================================================
GENERATE PROMPT
========================================================= */

function generatePrompt() {

    if (
        !gameState ||
        Number(
            gameState.completed_count || 0
        ) < 10
    ) {

        return;

    }


    const a =
        gameState.a;

    const b =
        gameState.b;


    outputText.value =

        `假設全員巔峯，請問 A隊 PG「${a.pg}」SG「${a.sg}」SF「${a.sf}」PF「${a.pf}」C「${a.c}」同埋 B隊 PG「${b.pg}」SG「${b.sg}」SF「${b.sf}」PF「${b.pf}」C「${b.c}」，邊一隊更強？`;


    outputSection.style.display =
        "block";


    clearBtn.disabled = false;

}


/* =========================================================
COPY
========================================================= */

async function copyText() {

    if (!outputText.value) {

        return;

    }


    try {

        await navigator.clipboard.writeText(
            outputText.value
        );

        alert(
            "文案已成功複製！"
        );

    } catch {

        outputText.select();

        document.execCommand(
            "copy"
        );

        alert(
            "文案已成功複製！"
        );

    }

}


/* =========================================================
LEAVE ROOM
========================================================= */

async function leaveRoom() {

    if (
        !currentRoomCode
    ) {

        return;

    }


    const ok =
        confirm(
            "確定要退出目前房間嗎？"
        );


    if (!ok) {

        return;

    }


    try {

        roomStatus.textContent =
            "正在退出房間...";


        const {
            error
        } =
            await supabaseClient.rpc(
                "leave_nba_room",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken
                }
            );


        if (error) {

            throw error;

        }


        if (realtimeChannel) {

            await supabaseClient.removeChannel(
                realtimeChannel
            );

            realtimeChannel = null;

        }


        localStorage.removeItem(
            "nba_room_code"
        );

        localStorage.removeItem(
            "nba_my_role"
        );


        currentRoomCode = null;

        myRole = null;

        gameState = null;


        roomCode.textContent =
            "未加入";

        roleText.textContent =
            "請建立或加入房間";

        roomCount.textContent =
            "👥 0 / 2";

        roomStatus.textContent =
            "已退出房間";


        leaveRoomBtn.style.display =
            "none";


        outputSection.style.display =
            "none";


        resetGameUI();

    } catch (error) {

        console.error(error);

        alert(
            "退出房間失敗：\n" +
            error.message
        );

    }

}


/* =========================================================
ROOM DELETED
========================================================= */

function handleRoomDeleted() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;

    }


    localStorage.removeItem(
        "nba_room_code"
    );

    localStorage.removeItem(
        "nba_my_role"
    );


    currentRoomCode = null;

    myRole = null;

    gameState = null;


    roomCode.textContent =
        "未加入";

    roleText.textContent =
        "房間已結束";

    roomCount.textContent =
        "👥 0 / 2";

    roomStatus.textContent =
        "房主已退出，房間已關閉";


    leaveRoomBtn.style.display =
        "none";


    resetGameUI();

}


/* =========================================================
CLEAR LOCAL
========================================================= */

function clearLocalGame() {

    outputText.value = "";

    outputSection.style.display =
        "none";

    clearBtn.disabled =
        true;

}


/* =========================================================
URL ROOM
========================================================= */

const urlRoom =
    new URLSearchParams(
        window.location.search
    ).get("room");


if (urlRoom) {

    document.getElementById(
        "joinRoomInput"
    ).value =
        urlRoom
            .trim()
            .toUpperCase();

}


/* =========================================================
RESTORE
========================================================= */

(async function restoreRoom() {

    resetGameUI();


    if (
        currentRoomCode &&
        playerToken
    ) {

        await refreshRoom();


        if (gameState) {

            subscribeToRoom();

            updateRoomUI();

            roomStatus.textContent =
                "已重新連接房間";

        }

    }

})();


/* =========================================================
PERIODIC SYNC
防止 Realtime 暫時斷線
========================================================= */

setInterval(
    async () => {

        if (
            currentRoomCode &&
            playerToken
        ) {

            await refreshRoom();

        }

    },
    5000
);

</script>
