<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA 陣容抽籤與對戰工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #1d4ed8;
        }
        .team-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .team-box {
            flex: 1;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .team-box h2 {
            margin-top: 0;
            text-align: center;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.9em;
            color: #64748b;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            transition: all 0.2s;
        }
        input[type="text"]:disabled {
            background-color: #f1f5f9;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .btn-draw {
            background-color: #0284c7;
            color: white;
        }
        .btn-create {
            background-color: #16a34a;
            color: white;
        }
        .btn-copy {
            background-color: #ea580c;
            color: white;
        }
        .btn-clear {
            background-color: #dc2626;
            color: white;
        }
        button:disabled {
            background-color: #94a3b8 !important;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .output-section {
            margin-top: 25px;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1em;
            resize: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>🏀 NBA 陣容對戰生成器</h1>

    <div class="team-container">
        <!-- A 隊 -->
        <div class="team-box">
            <h2>A 隊</h2>
            <div class="input-group"><label>PG 控球後衛</label><input type="text" id="a_pg" class="player-input"></div>
            <div class="input-group"><label>SG 得分後衛</label><input type="text" id="a_sg" class="player-input"></div>
            <div class="input-group"><label>SF 小前鋒</label><input type="text" id="a_sf" class="player-input"></div>
            <div class="input-group"><label>PF 大前鋒</label><input type="text" id="a_pf" class="player-input"></div>
            <div class="input-group"><label>C 中鋒</label><input type="text" id="a_c" class="player-input"></div>
        </div>

        <!-- B 隊 -->
        <div class="team-box">
            <h2>B 隊</h2>
            <div class="input-group"><label>PG 控球後衛</label><input type="text" id="b_pg" class="player-input"></div>
            <div class="input-group"><label>SG 得分後衛</label><input type="text" id="b_sg" class="player-input"></div>
            <div class="input-group"><label>SF 小前鋒</label><input type="text" id="b_sf" class="player-input"></div>
            <div class="input-group"><label>PF 大前鋒</label><input type="text" id="b_pf" class="player-input"></div>
            <div class="input-group"><label>C 中鋒</label><input type="text" id="b_c" class="player-input"></div>
        </div>
    </div>

    <!-- 按鈕控制區 -->
    <div class="btn-group">
        <button id="createBtn" class="btn-create" onclick="generatePrompt()" disabled>創建文案</button>
        <button id="copyBtn" class="btn-copy" onclick="copyText()" disabled>複製文案</button>
        <button id="clearBtn" class="btn-clear" onclick="clearInputs()" disabled>清空重置</button>
    </div>

    <!-- 文案輸出區 -->
    <div class="output-section">
        <h3>生成文案結果：</h3>
        <textarea id="outputText" readonly placeholder="請填滿所有框後點擊「創建文案」..."></textarea>
    </div>

    <script>
        const inputs = Array.from(document.querySelectorAll('.player-input'));
        const createBtn = document.getElementById('createBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const outputText = document.getElementById('outputText');

        let hasCopied = false; // 紀錄是否已經複製過文案

        // 初始化狀態
        window.onload = function() {
            updateInputLogic();
        };

        // 監聽所有 Input 輸入狀態
        inputs.forEach(input => {
            input.addEventListener('input', updateInputLogic);
        });

        // 核心邏輯 1：單框輸入限制 + 全部填滿先亮起創建按鈕
        function updateInputLogic() {
            const filledInputs = inputs.filter(i => i.value.trim() !== '');

            // 限制：每次只可以喺一個框輸入，只要有其中一個框填咗，鎖住其他空白框
            if (filledInputs.length > 0 && filledInputs.length < inputs.length) {
                inputs.forEach(i => {
                    if (i.value.trim() === '') {
                        i.disabled = true;
                    } else {
                        i.disabled = false;
                    }
                });
            } else {
                // 如果全空或者全滿，所有框解鎖
                inputs.forEach(i => i.disabled = false);
            }

            // 檢查是否 10 個框全部都有填內容
            const isAllFilled = inputs.every(i => i.value.trim() !== '');
            createBtn.disabled = !isAllFilled; // 全部框起晒嘢先會亮起
        }

        // 生成文案
        function generatePrompt() {
            const getVal = (id) => document.getElementById(id).value.trim();

            const promptText = `假設全員巔峯 請問A隊 PG “${getVal('a_pg')}” SG “${getVal('a_sg')}” SF“${getVal('a_sf')}” PF “${getVal('a_pf')}” C “${getVal('a_c')}” 同埋 B隊 PG “${getVal('b_pg')}” SG “${getVal('b_sg')}” SF“${getVal('b_sf')}” PF “${getVal('b_pf')}” C “${getVal('b_c')}” 邊一隊更強`;

            outputText.value = promptText;
            copyBtn.disabled = false; // 亮起複製按鈕
        }

        // 核心邏輯 2：複製文案
        function copyText() {
            if (!outputText.value) return;

            outputText.select();
            document.execCommand('copy');

            hasCopied = true;
            clearBtn.disabled = false; // 複製完之後，解鎖清空按鈕，防誤觸！
            alert('文案已成功複製！現在可以使用「清空重置」按鈕。');
        }

        // 核心邏輯 3：防誤觸清空 (必須複製過先清到)
        function clearInputs() {
            if (!hasCopied) {
                alert('請先複製文案，才能進行清空！');
                return;
            }

            // 清空所有框內容並恢復預設
            inputs.forEach(input => {
                input.value = '';
                input.disabled = false;
            });

            outputText.value = '';

            // 重置按鈕狀態
            hasCopied = false;
            createBtn.disabled = true;
            copyBtn.disabled = true;
            clearBtn.disabled = true;

            updateInputLogic();
        }
    </script>
</body>
</html>
