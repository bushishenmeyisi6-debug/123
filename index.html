<style>

*{
box-sizing:border-box;
margin:0;
padding:0;

-apple-system,
BlinkMacSystemFont,

Roboto,
Arial,
sans-serif;

body{
background:#f0f2f5;
min-height:100vh;
color:#333;
padding:20px 0;
}

.container{
width:94%;
max-width:520px;
margin:auto;
background:#fff;
border-radius:20px;
padding:25px 20px;

h1{

/* =========================
PAGE SWITCH
========================= */

.page{
display:none;
}

.page.active{
display:block;
}

.page-switch{
position:absolute;
right:14px;
top:14px;
display:none;
gap:5px;
}

.page-switch button{
border:0;
background:#e2e8f0;
padding:7px 10px;
border-radius:8px;
font-size:.75rem;
font-weight:700;
cursor:pointer;
}

.page-switch button.active{
background:#006bb6;
color:white;
}


/* =========================
ROOM PAGE
========================= */

.room-section{
background:#f8fafc;
border:1px solid #e2e8f0;
border-radius:15px;
padding:18px;
}

.room-title{
font-size:1.1rem;
font-weight:800;
text-align:center;
margin-bottom:15px;
}

.room-code{
font-size:1.8rem;
font-weight:900;
letter-spacing:4px;
text-align:center;
color:#006bb6;
margin:10px;
}

.room-status{
text-align:center;
font-size:.9rem;
color:#64748b;
margin:10px 0 15px;
}

.name-area{
margin-bottom:15px;
}

.name-area label{
display:block;
font-weight:700;
margin-bottom:7px;
}

.name-input{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:9px;
outline:none;
font-size:1rem;
}

.room-actions{
display:flex;
gap:8px;
}

.room-input{
flex:1;
min-width:0;
padding:11px;
border:1px solid #cbd5e1;
border-radius:9px;
text-align:center;
font-weight:700;
letter-spacing:2px;
outline:none;
}

.room-btn{
border:0;
border-radius:9px;
padding:11px 13px;
font-weight:800;
color:white;
background:#006bb6;
cursor:pointer;
}

.room-btn:disabled{
background:#cbd5e1;
cursor:not-allowed;
}


/* =========================
PLAYERS
========================= */

.player-count{
text-align:center;
font-size:1rem;
font-weight:800;
margin:18px 0 12px;
}

.players{
display:flex;
justify-content:center;
align-items:center;
gap:25px;
}

.player-slot{
width:115px;
height:115px;
border-radius:50%;
border:3px solid #cbd5e1;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:12px;
background:#f8fafc;
font-weight:800;
overflow:hidden;
word-break:break-word;
transition:.25s;
}

.player-slot.filled{
border-color:#006bb6;
background:#eff6ff;
}

.player-slot.empty{
color:#94a3b8;
font-size:2rem;
}

.player-slot span{
display:block;
width:100%;
line-height:1.15;
}

.host-badge{
text-align:center;
font-size:.75rem;
color:#006bb6;
font-weight:700;
margin-top:6px;
}

.start-game{
width:100%;
margin-top:20px;
padding:14px;
border:0;
border-radius:11px;
background:#10b981;
color:white;
font-size:1.05rem;
font-weight:800;
cursor:pointer;
}

.start-game:disabled{
background:#cbd5e1;
color:#888;
cursor:not-allowed;
}

.leave-btn{
width:100%;
margin-top:10px;
padding:11px;
border:0;
border-radius:9px;
background:#ef4444;
color:white;
font-weight:800;
cursor:pointer;

GAME
========================= */

padding:10px;
border-radius:10px;

.game-page-title{

font-weight:800;

/* =========================================================
AUDIO
========================================================= */

let audioCtx=null;

function playTickSound(final=false){

try{

if(!audioCtx){

audioCtx=
new(
window.AudioContext||
window.webkitAudioContext
)();

}

if(audioCtx.state==="suspended"){
audioCtx.resume();
}

const osc=
audioCtx.createOscillator();

const gain=
audioCtx.createGain();

osc.type="sine";

osc.frequency.value=
final?1046:1200;

gain.gain.value=
final?.35:.25;

gain.gain.exponentialRampToValueAtTime(
.001,
audioCtx.currentTime+
(final?.6:.02)
);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();

osc.stop(
audioCtx.currentTime+
(final?.6:.02)
);

}catch(e){}

}

const span=el.querySelector("span");

}

el.classList.remove("empty");

let size=1.1;

if(name.length>=8) size=.9;
if(name.length>=11) size=.75;
if(name.length>=14) size=.65;
if(name.length>=17) size=.55;

span.style.fontSize=size+"rem";

}

}


startGameBtn.disabled=
!(
isHost &&
gameState?.player_count>=2 &&
!gameState?.started
);

}


/* =========================================================
PAGE
========================================================= */

function showPage(page){

if(page==="room"){

roomPage.classList.add("active");
gamePage.classList.remove("active");

roomPageBtn.classList.add("active");
gamePageBtn.classList.remove("active");

}else{

roomPage.classList.remove("active");
gamePage.classList.add("active");

roomPageBtn.classList.remove("active");
gamePageBtn.classList.add("active");

}

}


roomPageBtn.onclick=()=>{
showPage("room");
};

gamePageBtn.onclick=()=>{
showPage("game");
};


/* =========================================================
CREATE
========================================================= */

async function createRoom(){

const name=
nameInput.value.trim();

if(!name){

alert("請先輸入你的名字");
nameInput.focus();
return;

}

createRoomBtn.disabled=true;
joinRoomBtn.disabled=true;

roomStatus.textContent=
"正在建立房間...";

try{

const {data,error}=
await supabaseClient.rpc(
"create_nba_room",
{
p_token:playerToken,
p_name:name
}
);

if(error)throw error;

applyRoomData(data);

subscribeToRoom();

showPage("room");

}catch(error){

console.error(error);

alert(
"建立房間失敗：\n"+
error.message
);

createRoomBtn.disabled=false;
joinRoomBtn.disabled=false;

roomStatus.textContent=
"建立失敗";

}

}


/* =========================================================
JOIN
========================================================= */

async function joinRoom(){

const name=
nameInput.value.trim();

if(!name){

alert("請先輸入你的名字");
nameInput.focus();
return;

}

const code=
joinRoomInput.value
.trim()
.toUpperCase();

if(code.length!==6){

alert("請輸入 6 位房間碼");
return;

}

createRoomBtn.disabled=true;
joinRoomBtn.disabled=true;

roomStatus.textContent=
"正在加入房間...";

try{

const {data,error}=
await supabaseClient.rpc(
"join_nba_room",
{
p_code:code,
p_token:playerToken,
p_name:name
}
);

if(error)throw error;

applyRoomData(data);

subscribeToRoom();

showPage(
data.started?"game":"room"
);

}catch(error){

console.error(error);

alert(
"加入房間失敗：\n"+
error.message
);

createRoomBtn.disabled=false;
joinRoomBtn.disabled=false;

roomStatus.textContent=
"加入失敗";

}

}


/* =========================================================
APPLY ROOM
========================================================= */

function applyRoomData(data){

currentRoomCode=
data.room_code;

myRole=
data.role;

isHost=
Boolean(data.is_host);

gameState=
data.state;

if(!gameState.player1_name)
gameState.player1_name=
data.player1_name;

if(!gameState.player2_name)
gameState.player2_name=
data.player2_name;

gameState.player_count=
data.player_count;

gameState.started=
data.started;

updateRoomUI();

renderGame();

}


/* =========================================================
REALTIME
========================================================= */

function subscribeToRoom(){

if(realtimeChannel){

supabaseClient.removeChannel(
realtimeChannel
);

realtimeChannel=null;

}

if(!currentRoomCode)return;


realtimeChannel=
supabaseClient
.channel(
"nba-room-"+currentRoomCode
)
.on(
"postgres_changes",
{
event:"*",
schema:"public",
table:"nba_rooms",
filter:
`room_code=eq.${currentRoomCode}`
},
payload=>{

if(payload.eventType==="DELETE"){

handleRoomClosed();
return;

}

if(
payload.new &&
payload.new.game_state
){

const row=payload.new;

gameState=
row.game_state;

gameState.player_count=
row.player2_token?2:1;

gameState.player1_name=
row.player1_name;

gameState.player2_name=
row.player2_name;

gameState.started=
row.started;

if(
row.host_token===playerToken
){
isHost=true;
}else{
isHost=false;
}

updateRoomUI();

renderGame();

}

}
)
.subscribe(
status=>{
console.log(
"Realtime:",
status
);
}
);

}


/* =========================================================
CLOSED
========================================================= */

function handleRoomClosed(){

if(realtimeChannel){

supabaseClient.removeChannel(
realtimeChannel
);

realtimeChannel=null;

}

currentRoomCode=null;
myRole=null;
isHost=false;
gameState=null;

resetEverything();

updateRoomUI();

showPage("room");

roomStatus.textContent=
"房間已結束";

}


/* =========================================================
LEAVE
========================================================= */

async function leaveRoom(){

if(!currentRoomCode)return;

if(
!confirm("確定要退出房間嗎？")
)return;

leaveRoomBtn.disabled=true;

try{

const {error}=
await supabaseClient.rpc(
"leave_nba_room",
{
p_code:currentRoomCode,
p_token:playerToken
}
);

if(error)throw error;

if(realtimeChannel){

await supabaseClient.removeChannel(
realtimeChannel
);

realtimeChannel=null;

}

currentRoomCode=null;
myRole=null;
isHost=false;
gameState=null;

resetEverything();

updateRoomUI();

showPage("room");

roomStatus.textContent=
"已退出房間";

}catch(error){

console.error(error);

alert(
"退出房間失敗：\n"+
error.message
);

}

leaveRoomBtn.disabled=false;

}


/* =========================================================
START GAME
========================================================= */

async function startGame(){

if(!isHost)return;

try{

const {data,error}=
await supabaseClient.rpc(
"start_nba_game",
{
p_code:currentRoomCode,
p_token:playerToken
}
);

if(error)throw error;

applyRoomData(data);

showPage("game");

}catch(error){

alert(
"開始遊戲失敗：\n"+
error.message
);

}

}


/* =========================================================
RESET
========================================================= */

function resetEverything(){

allInputs.forEach(input=>{

input.value="";
input.disabled=true;

});

resetDisplay();

rollPage.style.display="block";
inputPage.classList.remove("active");

recentTeam.style.display="none";

turnBanner.textContent="";

outputSection.style.display="none";

outputText.value="";

createBtn.disabled=true;
clearBtn.disabled=true;

copied=false;
selectedInput=null;

}


/* =========================================================
RENDER GAME
========================================================= */

function renderGame(){

if(!gameState)return;

updateTurnBanner();

updateGamePage();

renderPlayers();

updateOutputButton();

}


/* =========================================================
TURN
========================================================= */

function updateTurnBanner(){

if(
!gameState.started
){
turnBanner.textContent=
"等待房主開始遊戲";
return;
}

if(
gameState.phase==="done"
){

turnBanner.textContent=
"🏆 所有球員已完成";

return;

}

if(
gameState.turn===myRole
){

if(gameState.phase==="roll"){

turnBanner.textContent=
`🟢 到你（${myRole}隊）回合，請抽取球隊`;

}else{

turnBanner.textContent=
`🟢 ${myRole}隊請輸入一名球員`;

}

}else{

turnBanner.textContent=
`🔴 現在是 ${gameState.turn}隊回合`;

}

}


/* =========================================================
GAME PAGE
========================================================= */

function updateGamePage(){

if(!gameState.started){

pageSwitch.style.display="none";
return;

}

pageSwitch.style.display="flex";


if(
gameState.phase==="roll"
){

rollPage.style.display="block";
inputPage.classList.remove("active");

}else{

rollPage.style.display="none";
inputPage.classList.add("active");

}

}


/* =========================================================
PLAYER INPUT
========================================================= */

function renderPlayers(){

allInputs.forEach(input=>{

const [team,pos]=
input.id.split("_");

input.value=
gameState[team]?.[pos]||"";

input.disabled=true;

});


if(
!gameState.started ||
gameState.phase!=="input" ||
gameState.turn!==myRole
){

regretBtn.style.display="none";
return;

}


const team=
myRole.toLowerCase();


const available=
["pg","sg","sf","pf","c"]
.some(
p=>!gameState[team][p]
);


if(!available){

regretBtn.style.display="none";
return;

}


/*
   如果目前未選任何框
   五個都可以揀。
*/

if(!selectedInput){

["pg","sg","sf","pf","c"]
.forEach(pos=>{

const input=
document.getElementById(
`${team}_${pos}`
);

if(!gameState[team][pos])
input.disabled=false;

});

regretBtn.style.display="none";

return;

}


/*
   已選其中一個：
   其他全部鎖死。
*/

["pg","sg","sf","pf","c"]
.forEach(pos=>{

const input=
document.getElementById(
`${team}_${pos}`
);

if(
input===selectedInput &&
!gameState[team][pos]
){

input.disabled=false;

}else{

input.disabled=true;

}

});


regretBtn.style.display="block";

regretBtn.disabled=false;


/*
   有輸入先可以提交
*/

submitBtn.disabled=
!selectedInput ||
!selectedInput.value.trim();

}


/* =========================================================
INPUT FOCUS
========================================================= */

allInputs.forEach(input=>{

input.addEventListener(
"focus",
()=>{

if(
!gameState ||
gameState.phase!=="input" ||
gameState.turn!==myRole
)return;

const team=
myRole.toLowerCase();

if(
!input.id.startsWith(team+"_")
)return;

if(
gameState[team][
input.id.split("_")[1]
]
)return;


/*
  第一個被選中的框
*/

if(!selectedInput){

selectedInput=input;

renderPlayers();

input.focus();

}

}
);


/*
  一旦輸入：
  其他框永久鎖到後悔
*/

input.addEventListener(
"input",
()=>{

if(
input!==selectedInput
)return;

submitBtn.disabled=
!input.value.trim();

}
);


/*
  Enter
*/

input.addEventListener(
"keydown",
async event=>{

if(event.key!=="Enter")
return;

event.preventDefault();

if(
selectedInput===input &&
input.value.trim()
){

await submitCurrentInput();

}

}
);

});


/* =========================================================
REGRET
========================================================= */

regretBtn.addEventListener(
"click",
()=>{

if(!selectedInput)return;

selectedInput.value="";

selectedInput=null;

submitBtn.disabled=true;

renderPlayers();

}
);


/* =========================================================
SUBMIT
========================================================= */

async function submitCurrentInput(){

if(!selectedInput)return;

const name=
selectedInput.value.trim();

if(!name){

alert("請輸入球員名字");
return;

}


const position=
selectedInput.id.split("_")[1];


submitBtn.disabled=true;

try{

const {data,error}=
await supabaseClient.rpc(
"fill_nba_player",
{
p_code:currentRoomCode,
p_token:playerToken,
p_position:position,
p_player_name:name
}
);

if(error)throw error;

selectedInput=null;

applyRoomData(data);

}catch(error){

console.error(error);

alert(error.message);

await refreshRoom();

}

}


/* =========================================================
SUBMIT BUTTON
========================================================= */

submitBtn.addEventListener(
"click",
submitCurrentInput
);


/* =========================================================
ROLL
========================================================= */

rollBtn.addEventListener(
"click",
startRolling
);


async function startRolling(){

if(isRolling)return;

if(
!gameState ||
!gameState.started ||
gameState.phase!=="roll"
)return;

if(
gameState.turn!==myRole
)return;


isRolling=true;

rollBtn.disabled=true;

displayCard.classList.add("active");


try{

const {data,error}=
await supabaseClient.rpc(
"roll_nba_room",
{
p_code:currentRoomCode,
p_token:playerToken
}
);

if(error)throw error;

const index=
Number(
data.state.selected_team_index
);

await animateRoll(index);

applyRoomData(data);

showRecentTeam(index);

}catch(error){

console.error(error);

alert(error.message);

await refreshRoom();

}


isRolling=false;

displayCard.classList.remove("active");

}


/* =========================================================
ANIMATION
========================================================= */

function animateRoll(finalIndex){

return new Promise(resolve=>{

let delay=20;
let count=0;
const maxSteps=35;
let lastIndex=activeNodeIndex;


function step(){

let index;

if(count===maxSteps-1){

index=finalIndex;

}else{

do{

index=
Math.floor(
Math.random()*30
);

}while(index===lastIndex);

}


teamNodeElements.forEach(node=>{
node.classList.remove(
"show",
"pop"
);
});

pendingNode.classList.remove("show");

const node=
teamNodeElements[index];

node.classList.add("show");

node.classList.remove("pop");

void node.offsetWidth;

node.classList.add("pop");

lastIndex=index;
activeNodeIndex=index;

count++;

const remaining=
maxSteps-count;

playTickSound(
remaining===0
);

if(remaining===0){

resolve();
return;

}

if(remaining===1)
delay=550;
else if(remaining===2)
delay=400;
else if(remaining===3)
delay=280;
else if(remaining===4)
delay=180;
else if(remaining===5)
delay=110;
else if(remaining<=10)
delay+=10;

setTimeout(
step,
delay
);

}

step();

});

}


/* =========================================================
SHOW RECENT TEAM
========================================================= */

function showRecentTeam(index){

if(
index===null ||
index===undefined ||
!nbaTeams[index]
){

recentTeam.style.display="none";
return;

}

recentTeamName.textContent=
`${nbaTeams[index].zh} (${nbaTeams[index].en})`;

recentTeam.style.display="block";

}


/* =========================================================
DISPLAY
========================================================= */

function resetDisplay(){

teamNodeElements.forEach(node=>{
node.classList.remove(
"show",
"pop"
);
});

pendingNode.classList.add("show");

}


function updateDisplay(){

const selected=
gameState?.selected_team_index;

if(
selected===null ||
selected===undefined
){

resetDisplay();
return;

}

const index=
Number(selected);

if(!teamNodeElements[index])
return;

pendingNode.classList.remove("show");

teamNodeElements.forEach(node=>{
node.classList.remove(
"show",
"pop"
);
});

teamNodeElements[index]
.classList.add("show");

}


/* =========================================================
OUTPUT
========================================================= */

function updateOutputButton(){

if(
!gameState ||
gameState.phase!=="done"
){

createBtn.disabled=true;
return;

}

createBtn.disabled=
Number(
gameState.completed_count
)<10;

}


/* =========================================================
CREATE PROMPT
========================================================= */

createBtn.addEventListener(
"click",
()=>{

if(
!gameState ||
gameState.phase!=="done"
)
return;


const a=gameState.a;
const b=gameState.b;


outputText.value=
`假設全員巔峯，A隊 PG「${a.pg}」SG「${a.sg}」SF「${a.sf}」PF「${a.pf}」C「${a.c}」和 B隊 PG「${b.pg}」SG「${b.sg}」SF「${b.sf}」PF「${b.pf}」C「${b.c}」，邊一隊更強？`;


outputSection.style.display="block";

outputSection.scrollIntoView({
behavior:"smooth"
});

clearBtn.disabled=true;

copied=false;

}
);


/* =========================================================
COPY
========================================================= */

copyBtn.addEventListener(
"click",
async()=>{

if(!outputText.value)
return;

try{

await navigator.clipboard.writeText(
outputText.value
);

}catch(e){

outputText.select();

document.execCommand("copy");

}

copied=true;

clearBtn.disabled=false;

alert("文案已成功複製！");

}
);


/* =========================================================
CLEAR
========================================================= */

clearBtn.addEventListener(
"click",
()=>{

if(!copied)
return;

allInputs.forEach(input=>{
input.value="";
input.disabled=true;
});

outputText.value="";

outputSection.style.display="none";

clearBtn.disabled=true;

copied=false;

}
);


/* =========================================================
REFRESH ROOM
========================================================= */

async function refreshRoom(){

if(!currentRoomCode)
return;

try{

const {data,error}=
await supabaseClient.rpc(
"get_nba_room",
{
p_code:currentRoomCode,
p_token:playerToken
}
);

if(error)throw error;

applyRoomData(data);

}catch(error){

console.error(error);

}

}


/* =========================================================
BUTTONS
========================================================= */

createRoomBtn.onclick=
createRoom;

joinRoomBtn.onclick=
joinRoom;

startGameBtn.onclick=
startGame;

leaveRoomBtn.onclick=
leaveRoom;


/* =========================================================
URL ROOM
========================================================= */

const params=
new URLSearchParams(
location.search
);

const roomFromUrl=
params.get("room");

if(roomFromUrl){

joinRoomInput.value=
roomFromUrl
.trim()
.toUpperCase();

}


/* =========================================================
INITIAL
========================================================= */

resetEverything();

updateRoomUI();

showPage("room");


/*
  定期同步一次。
  Realtime 正常時唔會靠佢，
  但可以避免瀏覽器偶發斷線造成畫面唔同步。
*/

setInterval(
async()=>{
if(currentRoomCode)
await refreshRoom();
},
5000
);

</script>
