<!DOCTYPE html>
<html lang="zh-HK">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NBA 球隊隨機抽籤 & 陣容對決</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {

    background: #f0f2f5;

    min-height: 100vh;

    color: #333;

    padding: 20px 0;
}

button,
input,
textarea {

    font: inherit;

}

button {

    -webkit-tap-highlight-color: transparent;

}

.app {

    width: 94%;

    max-width: 520px;

    margin: 0 auto;

}


/* =====================================================
Header
===================================================== */

.top-header {

    background: white;

    border-radius: 18px;

    padding: 16px 18px;

    margin-bottom: 15px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.08);

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

}

.top-title {

    font-weight: 800;

    color: #1e293b;

}

.page-switch {

    border: none;

    background: #e2e8f0;

    color: #334155;

    padding: 8px 12px;

    border-radius: 9px;

    font-weight: 700;

    cursor: pointer;

    white-space: nowrap;

}


/* =====================================================
Pages
===================================================== */

.page {

    display: none;

}

.page.active {

    display: block;

}


/* =====================================================
Card
===================================================== */

.card {

    background: white;

    border-radius: 20px;

    padding: 22px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.08);

    margin-bottom: 15px;

}


/* =====================================================
Room page
===================================================== */

.room-title {

    text-align: center;

    font-size: 1.35rem;

    font-weight: 900;

    color: #1e293b;

    margin-bottom: 5px;

}

.room-subtitle {

    text-align: center;

    color: #64748b;

    font-size: .9rem;

    margin-bottom: 22px;

}

.name-label {

    display: block;

    text-align: left;

    font-size: .9rem;

    font-weight: 700;

    color: #475569;

    margin-bottom: 7px;

}

.name-input {

    width: 100%;

    padding: 13px;

    border: 1px solid #cbd5e1;

    border-radius: 11px;

    outline: none;

    text-align: center;

    font-weight: 700;

    margin-bottom: 12px;

}

.name-input:focus {

    border-color: #006bb6;

    box-shadow:
        0 0 0 3px rgba(0,107,182,.12);

}

.primary-btn {

    width: 100%;

    border: none;

    background: #006bb6;

    color: white;

    padding: 13px;

    border-radius: 11px;

    font-weight: 800;

    cursor: pointer;

}

.primary-btn:disabled {

    background: #cbd5e1;

    cursor: not-allowed;

}

.room-divider {

    display: flex;

    align-items: center;

    gap: 10px;

    color: #94a3b8;

    margin: 18px 0;

    font-size: .85rem;

}

.room-divider::before,
.room-divider::after {

    content: "";

    height: 1px;

    flex: 1;

    background: #e2e8f0;

}

.join-row {

    display: flex;

    gap: 8px;

}

.join-row input {

    flex: 1;

    min-width: 0;

    padding: 12px;

    border: 1px solid #cbd5e1;

    border-radius: 10px;

    text-align: center;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;

    outline: none;

}

.join-row button {

    border: none;

    background: #121212;

    color: white;

    border-radius: 10px;

    padding: 0 17px;

    font-weight: 800;

    cursor: pointer;

}

.room-message {

    text-align: center;

    color: #64748b;

    margin-top: 14px;

    font-size: .9rem;

}


/* =====================================================
Waiting Room
===================================================== */

.waiting-room {

    text-align: center;

}

.room-code-big {

    font-size: 2.1rem;

    letter-spacing: 5px;

    font-weight: 900;

    color: #006bb6;

    margin: 8px 0 3px;

}

.room-count {

    font-size: .95rem;

    color: #64748b;

    margin-bottom: 20px;

}

.players-row {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 20px;

    margin: 20px 0 25px;

}

.player-circle {

    width: 125px;

    height: 125px;

    border-radius: 50%;

    border: 4px solid #cbd5e1;

    background: #f8fafc;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 12px;

    text-align: center;

    overflow: hidden;

    transition:
        .25s ease;

}

.player-circle.filled {

    border-color: #006bb6;

    background: #eff6ff;

}

.player-name {

    font-weight: 900;

    line-height: 1.1;

    word-break: break-word;

    overflow-wrap: anywhere;

}

.player-empty {

    color: #94a3b8;

    font-weight: 800;

    font-size: 1.8rem;

}

.host-badge {

    margin-top: -8px;

    margin-bottom: 14px;

    color: #006bb6;

    font-size: .8rem;

    font-weight: 800;

}

.waiting-text {

    color: #64748b;

    font-size: .9rem;

    margin-bottom: 15px;

}

.start-btn {

    width: 100%;

    border: none;

    padding: 14px;

    border-radius: 12px;

    background: #10b981;

    color: white;

    font-weight: 900;

    font-size: 1.05rem;

    cursor: pointer;

}

.start-btn:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

}

.leave-btn {

    width: 100%;

    margin-top: 9px;

    border: none;

    background: #ef4444;

    color: white;

    padding: 11px;

    border-radius: 10px;

    font-weight: 800;

    cursor: pointer;

}


/* =====================================================
Game
===================================================== */

.game-card {

    text-align: center;

}

.turn-banner {

    padding: 10px;

    border-radius: 10px;

    background: #eff6ff;

    color: #1d4ed8;

    font-weight: 800;

    margin-bottom: 15px;

    font-size: .9rem;

}

.phase-label {

    color: #64748b;

    font-size: .85rem;

    font-weight: 700;

    margin-bottom: 7px;

}

.display-card {

    background: #fff;

    border: 2px solid #e2e8f0;

    border-radius: 16px;

    padding: 20px;

    min-height: 270px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    overflow: hidden;

    transition:
        border-color .3s ease,
        box-shadow .3s ease;

}

.display-card.active {

    border-color: #006bb6;

    box-shadow:
        0 0 15px rgba(0,107,182,.15);

}

.team-node {

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

}

.team-node.show {

    display: flex;

}

.team-node.pop {

    animation:
        popIn .08s ease-out forwards;

}

@keyframes popIn {

    from {
        transform: scale(.9);
    }

    to {
        transform: scale(1);
    }

}

.team-logo {

    width: 105px;

    height: 105px;

    object-fit: contain;

    margin-bottom: 10px;

}

.team-zh {

    font-size: 2.5rem;

    font-weight: 900;

    line-height: 1.05;

    color: #1a202c;

}

.team-en {

    color: #718096;

    font-size: .95rem;

    margin-top: 6px;

}

.roll-btn {

    width: 100%;

    border: none;

    background: #121212;

    color: white;

    padding: 14px;

    border-radius: 12px;

    font-size: 1.05rem;

    font-weight: 800;

    cursor: pointer;

    margin-top: 15px;

}

.roll-btn:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

}


/* =====================================================
Last team mini display
===================================================== */

.last-team {

    display: none;

    margin-bottom: 14px;

    background: #f8fafc;

    border: 1px solid #e2e8f0;

    border-radius: 11px;

    padding: 9px;

    align-items: center;

    justify-content: center;

    gap: 8px;

}

.last-team.show {

    display: flex;

}

.last-team img {

    width: 30px;

    height: 30px;

    object-fit: contain;

}

.last-team-text {

    font-size: .82rem;

    color: #475569;

    font-weight: 800;

}


/* =====================================================
Input page
===================================================== */

.input-page {

    display: none;

}

.input-page.active {

    display: block;

}

.input-title {

    text-align: center;

    font-weight: 900;

    font-size: 1.25rem;

    color: #1e293b;

    margin-bottom: 5px;

}

.input-subtitle {

    text-align: center;

    color: #64748b;

    font-size: .85rem;

    margin-bottom: 14px;

}

.input-team-preview {

    background: #eff6ff;

    border-radius: 11px;

    padding: 9px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    margin-bottom: 16px;

}

.input-team-preview img {

    width: 35px;

    height: 35px;

    object-fit: contain;

}

.input-team-preview span {

    color: #1d4ed8;

    font-weight: 900;

}

.position-list {

    display: flex;

    flex-direction: column;

    gap: 10px;

}

.position-row {

    display: flex;

    align-items: center;

    gap: 8px;

}

.pos-label {

    width: 42px;

    text-align: right;

    font-weight: 900;

    color: #475569;

    font-size: .9rem;

}

.player-input {

    flex: 1;

    width: 100%;

    padding: 11px;

    border: 1px solid #cbd5e1;

    border-radius: 9px;

    outline: none;

    font-weight: 700;

}

.player-input:focus {

    border-color: #006bb6;

    box-shadow:
        0 0 0 3px rgba(0,107,182,.1);

}

.player-input:disabled {

    background: #e9eef5;

    color: #94a3b8;

    cursor: not-allowed;

}

.regret-btn {

    width: 100%;

    border: none;

    background: #ef4444;

    color: white;

    padding: 13px;

    border-radius: 11px;

    font-weight: 900;

    margin-top: 14px;

    cursor: pointer;

}

.regret-btn:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

}


/* =====================================================
Final
===================================================== */

.final-actions {

    display: flex;

    gap: 9px;

    margin-top: 18px;

}

.create-prompt-btn {

    flex: 3;

    border: none;

    background: #10b981;

    color: white;

    padding: 13px;

    border-radius: 11px;

    font-weight: 900;

    cursor: pointer;

}

.create-prompt-btn:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

}

.clear-btn {

    flex: 1;

    border: none;

    background: #ef4444;

    color: white;

    padding: 13px;

    border-radius: 11px;

    font-weight: 900;

    cursor: pointer;

}

.clear-btn:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

}

.output-section {

    display: none;

    margin-top: 15px;

    background: #f1f5f9;

    border: 1px solid #cbd5e1;

    border-radius: 12px;

    padding: 13px;

}

.output-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 8px;

}

.output-status {

    color: #10b981;

    font-weight: 900;

    font-size: .9rem;

}

.copy-btn {

    border: none;

    background: #e2e8f0;

    color: #334155;

    padding: 5px 10px;

    border-radius: 7px;

    font-weight: 800;

    cursor: pointer;

}

.output-text {

    width: 100%;

    min-height: 110px;

    border: none;

    background: transparent;

    resize: none;

    outline: none;

    color: #334155;

    line-height: 1.5;

}


/* =====================================================
Mobile
===================================================== */

@media(max-width:430px) {

    .player-circle {

        width: 108px;

        height: 108px;

    }

    .players-row {

        gap: 12px;

    }

    .team-zh {

        font-size: 2.2rem;

    }

}

</style>

</head>


<body>

<div class="app">


<!-- =====================================================
TOP HEADER
===================================================== -->

<div class="top-header">

    <div class="top-title">
        NBA 球隊隨機抽籤
    </div>

    <button
        class="page-switch"
        id="pageSwitchBtn"
        style="display:none"
    >
        房間
    </button>

</div>


<!-- =====================================================
PAGE 1：建立 / 加入
===================================================== -->

<section
    id="entryPage"
    class="page active"
>

<div class="card">

    <div class="room-title">
        聯機房間
    </div>

    <div class="room-subtitle">
        兩位玩家一齊進行 NBA 隨機抽籤
    </div>


    <label class="name-label">
        你嘅名字
    </label>

    <input
        id="entryName"
        class="name-input"
        maxlength="20"
        placeholder="輸入你嘅名字"
    >


    <button
        id="createRoomBtn"
        class="primary-btn"
    >
        建立房間
    </button>


    <div class="room-divider">
        或者
    </div>


    <label class="name-label">
        加入房間
    </label>


    <div class="join-row">

        <input
            id="joinRoomInput"
            maxlength="6"
            placeholder="房間碼"
        >

        <button
            id="joinRoomBtn"
        >
            加入
        </button>

    </div>


    <div
        id="entryMessage"
        class="room-message"
    >
        尚未加入房間
    </div>

</div>

</section>


<!-- =====================================================
PAGE 2：房間
===================================================== -->

<section
    id="roomPage"
    class="page"
>

<div class="card waiting-room">

    <div class="room-title">
        等待房間
    </div>

    <div
        id="roomCodeDisplay"
        class="room-code-big"
    >
        ------
    </div>

    <div
        id="roomCount"
        class="room-count"
    >
        1/2
    </div>


    <div class="players-row">

        <div
            id="playerCircle1"
            class="player-circle filled"
        >

            <span
                id="playerName1"
                class="player-name"
            ></span>

        </div>


        <div
            id="playerCircle2"
            class="player-circle"
        >

            <span
                id="playerName2"
                class="player-empty"
            >
                +
            </span>

        </div>

    </div>


    <div
        id="hostBadge"
        class="host-badge"
    >
        你係房主
    </div>


    <div
        id="waitingText"
        class="waiting-text"
    >
        等待第二位玩家加入
    </div>


    <button
        id="startGameBtn"
        class="start-btn"
        disabled
    >
        開始遊戲
    </button>


    <button
        id="leaveRoomBtn"
        class="leave-btn"
    >
        退出房間
    </button>

</div>

</section>


<!-- =====================================================
PAGE 3：抽球隊
===================================================== -->

<section
    id="rollPage"
    class="page"
>

<div class="card game-card">

    <div
        id="turnBannerRoll"
        class="turn-banner"
    >
        等待遊戲
    </div>


    <div class="phase-label">
        球隊抽籤
    </div>


    <div
        id="lastTeamPreviewRoll"
        class="last-team"
    >

        <img id="lastTeamLogoRoll">

        <span
            id="lastTeamTextRoll"
            class="last-team-text"
        ></span>

    </div>


    <div
        id="displayCardRoll"
        class="display-card"
    >

        <div
            id="pendingRoll"
            class="team-node show"
        >

            <img
                src="https://a.espncdn.com/i/teamlogos/leagues/500/nba.png"
                class="team-logo"
                style="opacity:.35"
            >

            <div class="team-zh">
                待定
            </div>

            <div class="team-en">
                Pending
            </div>

        </div>

    </div>


    <button
        id="rollBtn"
        class="roll-btn"
        disabled
    >
        等待玩家
    </button>

</div>

</section>


<!-- =====================================================
PAGE 4：輸入球員
===================================================== -->

<section
    id="inputPage"
    class="page"
>

<div class="card">

    <div
        id="turnBannerInput"
        class="turn-banner"
    >
        等待玩家
    </div>


    <div class="input-title">
        輸入球員
    </div>

    <div class="input-subtitle">
        其他玩家可以即時睇到你輸入嘅結果
    </div>


    <div
        id="inputTeamPreview"
        class="input-team-preview"
    >

        <img
            id="inputTeamLogo"
        >

        <span
            id="inputTeamName"
        ></span>

    </div>


    <div
        id="positionList"
        class="position-list"
    >

        <div class="position-row">
            <span class="pos-label">PG-</span>
            <input
                id="a_pg"
                class="player-input"
            >
        </div>

        <div class="position-row">
            <span class="pos-label">SG-</span>
            <input
                id="a_sg"
                class="player-input"
            >
        </div>

        <div class="position-row">
            <span class="pos-label">SF-</span>
            <input
                id="a_sf"
                class="player-input"
            >
        </div>

        <div class="position-row">
            <span class="pos-label">PF-</span>
            <input
                id="a_pf"
                class="player-input"
            >
        </div>

        <div class="position-row">
            <span class="pos-label">C-</span>
            <input
                id="a_c"
                class="player-input"
            >
        </div>


        <div class="position-row">
            <span class="pos-label">PG-</span>
            <input
                id="b_pg"
                class="player-input"
            >
        </div>

        <div class="position-row">
            <span class="pos-label">SG-</span>
            <input
                id="b_sg"
                class="player-input"
            >
        </div>

        <div class="position-row">
            <span class="pos-label">SF-</span>
            <input
                id="b_sf"
                class="player-input"
            >
        </div>

        <div class="position-row">
            <span class="pos-label">PF-</span>
            <input
                id="b_pf"
                class="player-input"
            >
        </div>

        <div class="position-row">
            <span class="pos-label">C-</span>
            <input
                id="b_c"
                class="player-input"
            >
        </div>

    </div>


    <button
        id="regretBtn"
        class="regret-btn"
        disabled
    >
        我後悔了 我要選擇其他位置
    </button>


    <div class="final-actions">

        <button
            id="createPromptBtn"
            class="create-prompt-btn"
            disabled
        >
            創建球隊完成
        </button>

        <button
            id="clearBtn"
            class="clear-btn"
            disabled
        >
            清空
        </button>

    </div>


    <div
        id="outputSection"
        class="output-section"
    >

        <div class="output-header">

            <span class="output-status">
                已生成文案！
            </span>

            <button
                id="copyBtn"
                class="copy-btn"
            >
                複製文案
            </button>

        </div>

        <textarea
            id="outputText"
            class="output-text"
            readonly
        ></textarea>

    </div>

</div>

</section>


</div>

/* =========================================================
Pages
========================================================= */

function showPage(page) {

    [
        entryPage,
        roomPage,
        rollPage,
        inputPage
    ].forEach(
        x => x.classList.remove("active")
    );


    page.classList.add("active");


    if (
        page === entryPage
    ) {

        pageSwitchBtn.style.display =
            "none";

        return;

    }


    pageSwitchBtn.style.display =
        "block";


    if (
        page === roomPage
    ) {

        pageSwitchBtn.textContent =
            "遊戲";

    } else {

        pageSwitchBtn.textContent =
            "房間";

    }

}


/* =========================================================
Player name font size
========================================================= */

function updatePlayerNameSize(
    element,
    name
) {

    element.textContent =
        name || "";


    if (!name) {

        element.className =
            "player-empty";

        element.textContent =
            "+";

        return;

    }


    element.className =
        "player-name";


    const length =
        [...name].length;


    let size = 1.45;


    if (length <= 4)
        size = 1.45;

    else if (length <= 6)
        size = 1.25;

    else if (length <= 8)
        size = 1.05;

    else if (length <= 11)
        size = .9;

    else
        size = .75;


    element.style.fontSize =
        size + "rem";

}


/* =========================================================
Room UI
========================================================= */

function renderRoom() {

    if (!gameState)
        return;


    const count =
        Number(
            gameState.player_count || 1
        );


    const p1 =
        gameState.player1_name ||
        myName ||
        "";


    const p2 =
        gameState.player2_name ||
        "";


    roomCodeDisplay.textContent =
        currentRoomCode || "------";


    roomCount.textContent =
        `${count}/2`;


    updatePlayerNameSize(
        playerName1,
        p1
    );


    updatePlayerNameSize(
        playerName2,
        p2
    );


    playerCircle1.classList.add(
        "filled"
    );


    if (p2) {

        playerCircle2.classList.add(
            "filled"
        );

    } else {

        playerCircle2.classList.remove(
            "filled"
        );

    }


    hostBadge.style.display =
        isHost ? "block" : "none";


    if (count < 2) {

        waitingText.textContent =
            "等待第二位玩家加入";

        startGameBtn.disabled =
            true;

    } else {

        waitingText.textContent =
            "兩位玩家已經到齊";

        startGameBtn.disabled =
            !isHost;

    }


    if (!isHost && count >= 2) {

        startGameBtn.textContent =
            "等待房主開始";

    } else {

        startGameBtn.textContent =
            "開始遊戲";

    }

}


/* =========================================================
Room state helper
========================================================= */

function normalizeState(
    state
) {

    if (!state)
        return null;


    return {

        player_count:
            Number(
                state.player_count || 1
            ),

        phase:
            state.phase || "waiting",

        turn:
            state.turn ?? "A",

        completed_count:
            Number(
                state.completed_count || 0
            ),

        selected_team_index:
            state.selected_team_index,

        selected_team_role:
            state.selected_team_role,

        team_history:
            Array.isArray(
                state.team_history
            )
                ? state.team_history
                : [],

        a:
            state.a || {
                pg:"",
                sg:"",
                sf:"",
                pf:"",
                c:""
            },

        b:
            state.b || {
                pg:"",
                sg:"",
                sf:"",
                pf:"",
                c:""
            }

    };

}


/* =========================================================
Create room
========================================================= */

async function createRoom() {

    const name =
        entryName.value.trim();


    if (!name) {

        alert(
            "請先輸入你嘅名字"
        );

        entryName.focus();

        return;

    }


    createRoomBtn.disabled =
        true;

    joinRoomBtn.disabled =
        true;


    entryMessage.textContent =
        "正在建立房間...";


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "create_nba_room",
                {
                    p_token:
                        playerToken,

                    p_name:
                        name
                }
            );


        if (error)
            throw error;


        currentRoomCode =
            data.room_code;

        myRole =
            data.role;

        isHost =
            !!data.is_host;

        myName =
            name;


        gameState =
            normalizeState(
                data.state
            );


        gameState.player1_name =
            data.player1_name;

        gameState.player2_name =
            data.player2_name;


        await unlockAudio();


        subscribeToRoom();

        renderRoom();

        showPage(roomPage);


    } catch(error) {

        console.error(error);

        alert(
            "建立房間失敗：\n" +
            error.message
        );


        createRoomBtn.disabled =
            false;

        joinRoomBtn.disabled =
            false;


        entryMessage.textContent =
            "建立失敗";

    }

}

/* =========================================================
Realtime
========================================================= */

function subscribeToRoom() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel =
            null;

    }


    if (!currentRoomCode)
        return;


    realtimeChannel =
        supabaseClient
            .channel(
                "nba-room-" +
                currentRoomCode
            )
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "nba_rooms",
                    filter:
                        `room_code=eq.${currentRoomCode}`
                },
                async payload => {

                    if (
                        payload.eventType ===
                        "DELETE"
                    ) {

                        handleRoomDeleted();

                        return;

                    }


                    if (
                        !payload.new
                    )
                        return;


                    const row =
                        payload.new;


                    const state =
                        normalizeState(
                            row.game_state
                        );


                    if (!state)
                        return;


                    state.player1_name =
                        row.player1_name;

                    state.player2_name =
                        row.player2_name;


                    const oldState =
                        gameState;


                    gameState =
                        state;


                    /*
                       房間等待頁
                    */

                    if (
                        state.phase ===
                        "waiting"
                    ) {

                        renderRoom();

                        showPage(
                            roomPage
                        );

                        return;

                    }


                    /*
                       遊戲開始
                    */

                    if (
                        state.phase ===
                        "roll"
                    ) {

                        renderRoom();

                        await handleIncomingRoll(
                            oldState,
                            state
                        );

                        return;

                    }


                    /*
                       輸入球員
                    */

                    if (
                        state.phase ===
                        "input"
                    ) {

                        renderInputPage();

                        showPage(
                            inputPage
                        );

                        return;

                    }


                    /*
                       完成
                    */

                    if (
                        state.phase ===
                        "done"
                    ) {

                        renderInputPage();

                        showPage(
                            inputPage
                        );

                    }

                }
            )
            .subscribe(
                status => {

                    console.log(
                        "Realtime:",
                        status
                    );

                }
            );

}

/* =========================================================
Start game
========================================================= */

async function startGame() {

    if (!isHost)
        return;


    if (!gameState)
        return;


    if (
        Number(
            gameState.player_count
        ) < 2
    )
        return;


    startGameBtn.disabled =
        true;


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "start_nba_game",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken
                }
            );


        if (error)
            throw error;


        gameState =
            normalizeState(
                data.state
            );


        gameState.player1_name =
            gameState.player1_name ||
            null;


        /*
           先進抽籤頁
        */

        showPage(
            rollPage
        );


        renderRollPage();


    } catch(error) {

        console.error(error);

        alert(
            "開始遊戲失敗：\n" +
            error.message
        );


        startGameBtn.disabled =
            false;

    }

}


/* =========================================================
Unlock Audio
========================================================= */

let audioCtx = null;

async function unlockAudio() {

    try {

        if (!audioCtx) {

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if (
            audioCtx.state ===
            "suspended"
        ) {

            await audioCtx.resume();

        }


        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();


        gain.gain.value =
            0.00001;


        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );


        osc.start();

        osc.stop(
            audioCtx.currentTime + .01
        );

    } catch(e) {

        console.log(
            "Audio unlock failed",
            e
        );

    }

}


/* =========================================================
Sound
========================================================= */

function playTickSound(
    final = false
) {

    try {

        if (!audioCtx)
            return;


        if (
            audioCtx.state ===
            "suspended"
        )
            return;


        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();


        osc.type =
            "sine";


        osc.frequency.value =
            final
                ? 1046
                : 1200;


        gain.gain.setValueAtTime(
            final ? .32 : .18,
            audioCtx.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime +
            (final ? .55 : .035)
        );


        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );


        osc.start();

        osc.stop(
            audioCtx.currentTime +
            (final ? .55 : .035)
        );

    } catch(e) {}

}


/* =========================================================
Reset display
========================================================= */

function resetDisplay() {

    teamNodeElements.forEach(
        node => {

            node.classList.remove(
                "show",
                "pop"
            );

        }
    );


    pendingRoll.classList.add(

    );

}


/* =========================================================
Animate roll
========================================================= */

function animateRoll(
    finalIndex
) {

    if (
        animationPromise
    )
        return animationPromise;


    animationPromise =
        new Promise(
            resolve => {

                let count = 0;

                const maxSteps =
                    35;

                let delay = 20;

                let last =
                    -1;


                function step() {

                    let index;


                    if (
                        count ===
                        maxSteps - 1
                    ) {

                        index =
                            finalIndex;

                    } else {

                        do {

                            index =
                                Math.floor(
                                    Math.random() *
                                    nbaTeams.length
                                );

                        } while (
                            index === last
                        );

                    }


                    teamNodeElements.forEach(
                        node => {

                            node.classList.remove(
                                "show",
                                "pop"
                            );

                        }
                    );


                    pendingRoll.classList.remove(
                        "show"
                    );


                    const node =
                        teamNodeElements[index];


                    node.classList.add(
                        "show"
                    );


                    void node.offsetWidth;


                    node.classList.add(
                        "pop"
                    );


                    last =
                        index;


                    count++;


                    const remaining =
                        maxSteps -
                        count;


                    playTickSound(
                        remaining === 0
                    );


                    if (
                        remaining === 0
                    ) {

                        setTimeout(
                            resolve,
                            350
                        );

                        return;

                    }


                    if (
                        remaining === 1
                    )
                        delay = 550;

                    else if (
                        remaining === 2
                    )
                        delay = 400;

                    else if (
                        remaining === 3
                    )
                        delay = 280;

                    else if (
                        remaining === 4
                    )
                        delay = 180;

                    else if (
                        remaining === 5
                    )
                        delay = 110;

                    else if (
                        remaining <= 10
                    )
                        delay += 10;


                    setTimeout(
                        step,
                        delay
                    );

                }


                step();

            }
        );


    animationPromise.finally(
        () => {

            animationPromise =
                null;

        }
    );


    return animationPromise;

}


/* =========================================================
Incoming roll
========================================================= */

async function handleIncomingRoll(
    oldState,
    newState
) {

    const newIndex =
        newState.selected_team_index;


    const oldIndex =
        oldState
            ? oldState.selected_team_index
            : null;


    /*
       roll 階段嘅新狀態可能未有新隊伍，
       所以直接顯示 roll page。
    */

    if (
        newIndex === null ||
        newIndex === undefined
    ) {

        renderRollPage();

        showPage(
            rollPage
        );

        return;

    }


    const changed =
        oldIndex === null ||
        oldIndex === undefined ||
        Number(newIndex) !==
        Number(oldIndex);


    if (changed) {

        showPage(
            rollPage
        );


        displayCardRoll.classList.add(
            "active"
        );


        isRolling =
            true;


        rollBtn.disabled =
            true;


        await animateRoll(
            Number(newIndex)
        );


        isRolling =
            false;


        displayCardRoll.classList.remove(
            "active"
        );

    }


    /*
       抽完球隊後，
       所有人自動進入輸入頁。
    */

    if (
        newState.phase ===
        "input"
    ) {

        renderInputPage();

        showPage(
            inputPage
        );

    } else {

        renderRollPage();

    }

}


/* =========================================================
Render roll page
========================================================= */

function renderRollPage() {

    if (!gameState)
        return;


    const turn =
        gameState.turn;


    if (
        turn === myRole
    ) {

        turnBannerRoll.textContent =
            `🟢 到你（${myRole}隊）！請抽取球隊`;

        rollBtn.disabled =
            isRolling;

        rollBtn.textContent =
            "隨機抽取球隊";

    } else {

        turnBannerRoll.textContent =
            `🔴 現在係 ${turn}隊抽取球隊`;

        rollBtn.disabled =
            true;

        rollBtn.textContent =
            `等待 ${turn}隊抽取`;

    }


    /*
       如果已有最近一次球隊
    */

    if (
        gameState.selected_team_index !==
        null &&
        gameState.selected_team_index !==
        undefined
    ) {

        const index =
            Number(
                gameState.selected_team_index
            );


        if (
            nbaTeams[index]
        ) {

            lastTeamPreviewRoll.classList.add(
                "show"
            );


            lastTeamLogoRoll.src =
                nbaTeams[index].logo;


            lastTeamTextRoll.textContent =
                `啱啱抽到：${nbaTeams[index].zh} ${nbaTeams[index].en}`;

        }

    } else {

        lastTeamPreviewRoll.classList.remove(
            "show"
        );

    }


    if (
        !isRolling
    ) {

        /*
           正常狀態下顯示最近結果，
           未有結果則顯示待定。
        */

        const selected =
            gameState.selected_team_index;


        if (
            selected === null ||
            selected === undefined
        ) {

            resetDisplay();

        } else {

            showFinalTeam(
                Number(selected)
            );

        }

    }

}


/* =========================================================
Show final team
========================================================= */

function showFinalTeam(
    index
) {

    if (
        !teamNodeElements[index]
    )
        return;


    teamNodeElements.forEach(
        node => {

            node.classList.remove(
                "show",
                "pop"
            );

        }
    );


    pendingRoll.classList.remove(
        "show"
    );


    teamNodeElements[index]
        .classList.add(
            "show"
        );

}


/* =========================================================
Render input
========================================================= */

function renderInputPage() {

    if (!gameState)
        return;


    const currentRole =
        gameState.turn;


    if (
        gameState.phase ===
        "done"
    ) {

        turnBannerInput.textContent =
            "🏆 所有球員已經完成";

    } else if (
        currentRole === myRole
    ) {

        turnBannerInput.textContent =
            `🟢 到你（${myRole}隊）輸入球員`;

    } else {

        turnBannerInput.textContent =
            `👀 ${currentRole}隊正在輸入球員`;

    }


    const selected =
        gameState.selected_team_index;


    if (
        selected !== null &&
        selected !== undefined &&
        nbaTeams[
            Number(selected)
        ]
    ) {

        const team =
            nbaTeams[
                Number(selected)
            ];


        inputTeamLogo.src =
            team.logo;


        inputTeamName.textContent =
            `${team.zh} · ${team.en}`;

    }


    renderInputs();


    updateRegretButton();

    updateFinalButtons();

}


/* =========================================================
Render inputs
========================================================= */

function renderInputs() {

    allInputs.forEach(
        input => {

            const [
                team,
                position
            ] =
                input.id.split("_");


            input.value =
                gameState[
                    team
                ]?.[
                    position
                ] || "";


            input.disabled =
                true;

        }
    );


    if (
        gameState.phase !==
        "input"
    )
        return;


    if (
        gameState.turn !==
        myRole
    )
        return;


    const team =
        myRole.toLowerCase();


    /*
       已經揀緊一個框：
       只可以繼續嗰個框。
    */

    if (selectedInputId) {

        const selected =
            document.getElementById(
                selectedInputId
            );


        if (
            selected &&
            !selected.value
        ) {

            selected.disabled =
                false;

            return;

        }

    }


    /*
       未揀位置：
       5 個自己位置都可以揀。
    */

    [
        "pg",
        "sg",
        "sf",
        "pf",
        "c"
    ].forEach(
        position => {

            const input =
                document.getElementById(
                    `${team}_${position}`
                );


            if (
                input &&
                !input.value
            ) {

                input.disabled =
                    false;

            }

        }
    );

}


/* =========================================================
Input selection
========================================================= */

allInputs.forEach(
    input => {

        input.addEventListener(
            "focus",
            () => {

                if (!gameState)
                    return;


                if (
                    gameState.phase !==
                    "input"
                )
                    return;


                if (
                    gameState.turn !==
                    myRole
                )
                    return;


                const team =
                    myRole.toLowerCase();


                if (
                    !input.id.startsWith(
                        team + "_"
                    )
                ) {

                    return;

                }


                /*
                   一揀位置，
                   立即鎖其他位置。
                */

                selectedInputId =
                    input.id;


                lockOtherInputs(
                    input.id
                );


                updateRegretButton();

            }
        );


        input.addEventListener(
            "keydown",
            async event => {

                if (
                    event.key !==
                    "Enter"
                )
                    return;


                event.preventDefault();


                if (
                    input.value.trim()
                ) {

                    await submitCurrentInput(
                        input
                    );

                }

            }
        );

    }
);


/* =========================================================
Lock other inputs
========================================================= */

function lockOtherInputs(
    selectedId
) {

    allInputs.forEach(
        input => {

            if (
                input.id ===
                selectedId
            )
                return;


            input.disabled =
                true;

        }
    );

}


/* =========================================================
Regret
========================================================= */

function updateRegretButton() {

    regretBtn.disabled =
        !selectedInputId ||
        gameState?.turn !== myRole ||
        gameState?.phase !== "input";

}


regretBtn.addEventListener(
    "click",
    () => {

        if (
            !selectedInputId
        )
            return;


        const input =
            document.getElementById(
                selectedInputId
            );


        if (!input)
            return;


        /*
           清空當前輸入
        */

        input.value =
            "";


        /*
           放返 5 個位置畀玩家揀
        */

        selectedInputId =
            null;


        renderInputs();


        updateRegretButton();

    }
);


/* =========================================================
Submit input
========================================================= */

async function submitCurrentInput(
    input
) {

    if (!gameState)
        return;


    if (
        gameState.phase !==
        "input"
    )
        return;


    if (
        gameState.turn !==
        myRole
    )
        return;


    if (
        selectedInputId !==
        input.id
    ) {

        return;

    }


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "請輸入球員名字"
        );

        input.focus();

        return;

    }


    const position =
        input.id.split("_")[1];


    /*
       提交期間全部鎖死
    */

    allInputs.forEach(
        x => x.disabled = true
    );


    regretBtn.disabled =
        true;


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "fill_nba_player",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken,

                    p_position:
                        position,

                    p_player_name:
                        name
                }
            );


        if (error)
            throw error;


        gameState =
            normalizeState(
                data.state
            );


        /*
           取得下一狀態
        */

        selectedInputId =
            null;


        /*
           如果完成
        */

        if (
            gameState.phase ===
            "done"
        ) {

            renderInputPage();

            showPage(
                inputPage
            );

            return;

        }


        /*
           下一回合：
           回到抽球隊頁
        */

        if (
            gameState.phase ===
            "roll"
        ) {

            renderRollPage();

            showPage(
                rollPage
            );

        }

    } catch(error) {

        console.error(error);

        alert(
            error.message
        );


        renderInputs();

        updateRegretButton();

    }

}


/* =========================================================
Final buttons
========================================================= */

function allPlayersComplete() {

    if (!gameState)
        return false;


    return (
        gameState.phase ===
        "done" &&
        Number(
            gameState.completed_count
        ) >= 10
    );

}


function updateFinalButtons() {

    const complete =
        allPlayersComplete();


    createPromptBtn.disabled =
        !complete;


    clearBtn.disabled =
        !hasCopiedPrompt;

}


/* =========================================================
Generate prompt
========================================================= */

function generatePrompt() {

    if (
        !allPlayersComplete()
    )
        return;


    const a =
        gameState.a;

    const b =
        gameState.b;


    outputText.value =

        `假設全員巔峯，A隊 PG "${a.pg}" SG "${a.sg}" SF "${a.sf}" PF "${a.pf}" C "${a.c}" 和 B隊 PG "${b.pg}" SG "${b.sg}" SF "${b.sf}" PF "${b.pf}" C "${b.c}"，邊一隊更強？`;


    outputSection.style.display =
        "block";


    hasCopiedPrompt =
        false;


    updateFinalButtons();


    outputSection.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });

}


/* =========================================================
Copy
========================================================= */

copyBtn.addEventListener(
    "click",
    async () => {

        if (
            !outputText.value
        )
            return;


        try {

            await navigator.clipboard.writeText(
                outputText.value
            );

        } catch(e) {

            outputText.select();

            document.execCommand(
                "copy"
            );

        }


        hasCopiedPrompt =
            true;


        clearBtn.disabled =
            false;


        alert(
            "文案已成功複製！"
        );

    }
);


/* =========================================================
Clear
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        if (
            !hasCopiedPrompt
        )
            return;


        allInputs.forEach(
            input => {

                input.value =
                    "";

                input.disabled =
                    true;

            }
        );


        outputText.value =
            "";

        outputSection.style.display =
            "none";


        hasCopiedPrompt =
            false;


        clearBtn.disabled =
            true;

    }
);


/* =========================================================
Page switch
========================================================= */

pageSwitchBtn.addEventListener(
    "click",
    () => {

        if (
            !currentRoomCode
        )
            return;


        /*
           房間 ↔ 遊戲
        */

        if (
            roomPage.classList.contains(
                "active"
            )
        ) {

            if (
                gameState &&
                gameState.phase !==
                "waiting"
            ) {

                if (
                    gameState.phase ===
                    "roll"
                ) {

                    renderRollPage();

                    showPage(
                        rollPage
                    );

                } else {

                    renderInputPage();

                    showPage(
                        inputPage
                    );

                }

            }

        } else {

            renderRoom();

            showPage(
                roomPage
            );

        }

    }
);


/* =========================================================
Buttons
========================================================= */

createRoomBtn.addEventListener(
    "click",
    createRoom
);

joinRoomBtn.addEventListener(
    "click",
    joinRoom
);

startGameBtn.addEventListener(
    "click",
    startGame
);

leaveRoomBtn.addEventListener(
    "click",
    leaveRoom
);


/* =========================================================
Roll
========================================================= */

rollBtn.addEventListener(
    "click",
    async () => {

        if (
            isRolling ||
            !gameState
        )
            return;


        if (
            gameState.phase !==
            "roll"
        )
            return;


        if (
            gameState.turn !==
            myRole
        )
            return;


        /*
           再 unlock 一次，
           確保玩家已經有 audio permission。
        */

        await unlockAudio();


        isRolling =
            true;


        rollBtn.disabled =
            true;


        displayCardRoll.classList.add(
            "active"
        );


        try {

            const {
                data,
                error
            } =
                await supabaseClient.rpc(
                    "roll_nba_room",
                    {
                        p_code:
                            currentRoomCode,

                        p_token:
                            playerToken
                    }
                );


            if (error)
                throw error;


            const finalIndex =
                Number(
                    data.state
                        .selected_team_index
                );


            /*
               自己先播放
            */

            await animateRoll(
                finalIndex
            );


            gameState =
                normalizeState(
                    data.state
                );


            /*
               抽完後直接去輸入頁
            */

            if (
                gameState.phase ===
                "input"
            ) {

                renderInputPage();

                showPage(
                    inputPage
                );

            }

        } catch(error) {

            console.error(error);

            alert(
                error.message
            );

        }


        isRolling =
            false;


        displayCardRoll.classList.remove(
            "active"
        );

    }
);


/* =========================================================
Reset inputs
========================================================= */

function resetAllInputs() {

    allInputs.forEach(
        input => {

            input.value =
                "";

            input.disabled =
                true;

        }
    );


    selectedInputId =
        null;


    regretBtn.disabled =
        true;

}


/* =========================================================
URL room
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const roomFromUrl =
    params.get("room");


if (roomFromUrl) {

    joinRoomInput.value =
        roomFromUrl
            .trim()
            .toUpperCase();

}


/* =========================================================
Initial
========================================================= */

resetAllInputs();

resetDisplay();

showPage(
    entryPage
);

</script>

</body>

</html>
