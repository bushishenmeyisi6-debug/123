<html lang="zh-HK">

<head>

<title>NBA 球隊隨機抽籤 & 陣容對決</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

body {

    background: #f0f2f5;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100vh;

    color: #333;

    padding: 20px 0;
}

.container {

    background: #fff;

    padding: 30px 25px;

    border-radius: 20px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.1);

    text-align: center;

    width: 90%;

    max-width: 480px;
}

h1 {

    font-size: 1.3rem;

    color: #555;

    margin-bottom: 20px;

    letter-spacing: 1px;
}


/* =====================================================
房間
===================================================== */

.room-section {

    background: #f8fafc;

    border: 1px solid #e2e8f0;

    border-radius: 14px;

    padding: 15px;

    margin-bottom: 20px;
}

.room-title {

    font-weight: 700;

    color: #334155;

    margin-bottom: 10px;
}

.room-code {

    font-size: 1.8rem;

    font-weight: 900;

    letter-spacing: 4px;

    color: #006bb6;

    margin: 8px 0;
}

.role-text {

    font-size: .95rem;

    color: #64748b;

    margin-bottom: 12px;
}

.room-actions {

    display: flex;

    gap: 8px;
}

.room-input {

    flex: 1;

    min-width: 0;

    padding: 10px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;

    outline: none;

    text-align: center;

    font-weight: 600;

    letter-spacing: 1px;
}

.room-btn {

    border: none;

    color: #fff;

    background: #006bb6;

    border-radius: 8px;

    padding: 10px 12px;

    font-weight: 700;

    cursor: pointer;
}

.room-btn:hover {

    background: #005a99;
}

.room-btn:disabled {

    background: #cbd5e1;

    cursor: not-allowed;
}

.status-text {

    margin-top: 10px;

    font-size: .9rem;

    color: #64748b;
}

.leave-btn {

    margin-top: 10px;

    width: 100%;

    background: #ef4444;

    color: white;

    border: none;

    border-radius: 8px;

    padding: 9px;

    font-weight: 700;

    cursor: pointer;

    display: none;
}


/* =====================================================
回合
===================================================== */

.turn-banner {

    display: none;

    margin-bottom: 15px;

    padding: 10px;

    border-radius: 10px;

    background: #eff6ff;

    color: #1d4ed8;

    font-weight: 700;
}


/* =====================================================
Display
===================================================== */

.display-card {

    background: #fff;

    border: 2px solid #e2e8f0;

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;

    min-height: 230px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    overflow: hidden;

    transition:
        border-color .3s ease,
        box-shadow .3s ease;
}

.display-card.active {

    border-color: #006bb6;

    box-shadow:
        0 0 15px rgba(0,107,182,.15);
}

.team-node {

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;
}

.team-node.show {

    display: flex;
}

.team-node.pop {

    animation:
        popIn .08s ease-out forwards;
}

@keyframes popIn {

    from {
        transform: scale(.9);
    }

    to {
        transform: scale(1);
    }
}

.team-logo {

    width: 95px;

    height: 95px;

    margin-bottom: 12px;

    object-fit: contain;
}

.team-zh {

    font-size: 2.6rem;

    font-weight: 800;

    color: #1a202c;

    line-height: 1.1;

    margin-bottom: 6px;
}

.team-en {

    font-size: 1rem;

    color: #718096;

    font-weight: 500;
}


/* =====================================================
Roll
===================================================== */

.btn-roll {

    background: #121212;

    color: white;

    border: none;

    padding: 14px 24px;

    font-size: 1.1rem;

    font-weight: 600;

    border-radius: 12px;

    cursor: pointer;

    width: 100%;

    box-shadow:
        0 4px 12px rgba(0,0,0,.15);

    margin-bottom: 30px;
}

.btn-roll:hover {

    background: #333;
}

.btn-roll:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

    box-shadow: none;
}


/* =====================================================
Teams
===================================================== */

.divider {

    height: 1px;

    background: #e2e8f0;

    margin: 10px 0 25px;
}

.teams-container {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 20px;
}

.team-box {

    flex: 1;

    background: #f8fafc;

    padding: 15px 10px;

    border-radius: 12px;

    border: 1px solid #edf2f7;
}

.team-title {

    font-weight: 700;

    font-size: 1.1rem;

    color: #2d3748;

    margin-bottom: 15px;
}

.position-row {

    display: flex;

    align-items: center;

    margin-bottom: 10px;
}

.pos-label {

    width: 42px;

    text-align: right;

    font-weight: 700;

    font-size: .95rem;

    color: #4a5568;

    padding-right: 4px;
}

.player-input {

    flex: 1;

    padding: 6px 10px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;

    font-size: .9rem;

    outline: none;

    width: 100%;

    background: white;
}

.player-input:focus {

    border-color: #006bb6;

    box-shadow:
        0 0 0 2px rgba(0,107,182,.15);
}

.player-input:disabled {

    background: #e9eef5;

    color: #94a3b8;

    cursor: not-allowed;
}


/* =====================================================
Actions
===================================================== */

.action-btns {

    display: flex;

    gap: 10px;
}

.btn-create {

    flex: 3;

    background: #10b981;

    color: white;

    border: none;

    padding: 14px 18px;

    font-size: 1.05rem;

    font-weight: 600;

    border-radius: 12px;

    cursor: pointer;
}

.btn-create:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;
}

.btn-clear {

    flex: 1;

    background: #ef4444;

    color: white;

    border: none;

    padding: 14px 12px;

    font-size: 1rem;

    font-weight: 600;

    border-radius: 12px;

    cursor: pointer;
}

.btn-clear:disabled {

    background: #cbd5e1;

    color: #888;

/* =====================================================
Output
===================================================== */

.output-section {

.output-status {

.btn-copy {

    background: #e2e8f0;

    color: #334155;

    font-size: .8rem;

    font-weight: 600;

    border-radius: 6px;

    cursor: pointer;
}

.output-text {

    width: 100%;

    height: 90px;

    border: none;

    background: transparent;

    font-size: .9rem;

    color: #334155;

    resize: none;

    outline: none;

    line-height: 1.4;
}


@media(max-width:420px) {

    .container {

        width: 94%;

        padding: 25px 15px;
    }

        gap: 8px;
    }

    }

        width: 38px;

        font-size: .85rem;
    }

    .player-input {

    }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
Supabase
========================================================= */

const SUPABASE_URL =
    "https://yafuniflixhbkdcqnqfz.supabase.co";

const SUPABASE_KEY =
    "eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhZnVuaWZsaXhoYmtkY3FucWZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjM0ODQsImV4cCI6MjEwMjc5OTQ4NH0.IBxTIxuHXDBT6OhyTtMxPsigZgx5oca7ZjFHS7h6Zyg";

const {
    createClient

const supabaseClient =
    createClient(
        SUPABASE_URL,

    );


/* =========================================================
NBA
========================================================= */

const nbaTeams = [

["老鷹","Atlanta Hawks","atl"],
["塞爾提克","Boston Celtics","bos"],
["籃網","Brooklyn Nets","bkn"],
["黃蜂","Charlotte Hornets","cha"],
["公牛","Chicago Bulls","chi"],
["騎士","Cleveland Cavaliers","cle"],
["獨行俠","Dallas Mavericks","dal"],
["金塊","Denver Nuggets","den"],
["活塞","Detroit Pistons","det"],
["勇士","Golden State Warriors","gs"],
["火箭","Houston Rockets","hou"],
["遛馬","Indiana Pacers","ind"],
["快艇","LA Clippers","lac"],
["湖人","Los Angeles Lakers","lal"],
["灰熊","Memphis Grizzlies","mem"],
["熱火","Miami Heat","mia"],
["公鹿","Milwaukee Bucks","mil"],
["灰狼","Minnesota Timberwolves","min"],
["鵜鶘","New Orleans Pelicans","no"],
["尼克","New York Knicks","ny"],
["雷霆","Oklahoma City Thunder","okc"],
["魔術","Orlando Magic","orl"],
["七六人","Philadelphia 76ers","phi"],
["太陽","Phoenix Suns","phx"],
["開拓者","Portland Trail Blazers","por"],
["國王","Sacramento Kings","sac"],
["馬刺","San Antonio Spurs","sas"],
["猛龍","Toronto Raptors","tor"],
["爵士","Utah Jazz","utah"],
["奇才","Washington Wizards","was"]

].map(x => ({

    zh: x[0],

    en: x[1],

    logo:
        `https://a.espncdn.com/i/teamlogos/nba/500/${x[2]}.png`

}));


/* =========================================================
DOM
========================================================= */

const roomCode =
    document.getElementById("roomCode");

const roleText =
    document.getElementById("roleText");

const roomStatus =
    document.getElementById("roomStatus");

const createRoomBtn =
    document.getElementById("createRoomBtn");

const joinRoomBtn =
    document.getElementById("joinRoomBtn");

const joinRoomInput =
    document.getElementById("joinRoomInput");

const leaveRoomBtn =
    document.getElementById("leaveRoomBtn");

const rollBtn =
    document.getElementById("rollBtn");

const createBtn =
    document.getElementById("createBtn");

const clearBtn =
    document.getElementById("clearBtn");

const turnBanner =
    document.getElementById("turnBanner");

const displayCard =
    document.getElementById("displayCard");

const pendingNode =
    document.getElementById("node-pending");

const outputSection =
    document.getElementById("outputSection");

const outputText =
    document.getElementById("outputText");

const copyBtn =
    document.getElementById("copyBtn");


const allInputs =
    Array.from(
        document.querySelectorAll(".player-input")
    );


/* =========================================================
建立球隊 DOM
========================================================= */

const teamNodeElements = [];

nbaTeams.forEach(
    (team, index) => {

        const node =
            document.createElement("div");

        node.className =
            "team-node";

        node.innerHTML = `

            <img
                src="${team.logo}"
                class="team-logo"
                alt="${team.en}"
            >

            <div class="team-zh">
                ${team.zh}
            </div>

            <div class="team-en">
                ${team.en}
            </div>

        `;

        displayCard.appendChild(node);

        teamNodeElements.push(node);

    }
);


/* =========================================================
完全不用 Local Storage
========================================================= */

const playerToken =
    crypto.randomUUID();


let currentRoomCode =
    null;

let myRole =
    null;

let gameState =
    null;

let realtimeChannel =
    null;

let isRolling =
    false;

let activeNodeIndex =
    -1;

let hasCopiedPrompt =
    false;


/*
=========================================================
動畫同步控制
=========================================================

lastAnimatedTeamIndex：
記住最近一次已經播放過動畫的球隊。

rollingTeamIndex：
當某一次 Realtime 狀態正在播放動畫時，
避免同一個狀態再次觸發。

*/

let lastAnimatedTeamIndex =
    null;

let animationPromise =
    null;


/* =========================================================
音效
========================================================= */

let audioCtx = null;

function playTickSound(final = false) {

    try {

        if (!audioCtx) {

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if (
            audioCtx.state === "suspended"
        ) {

            audioCtx.resume();

        }

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.type = "sine";

        osc.frequency.value =
            final ? 1046 : 1200;

        gain.gain.value =
            final ? .35 : .25;

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime +
            (final ? .6 : .02)
        );

        osc.connect(gain);

        gain.connect(
            audioCtx.destination
        );

        osc.start();

        osc.stop(
            audioCtx.currentTime +
            (final ? .6 : .02)
        );

    } catch(e) {}

}


/* =========================================================
基本 UI
========================================================= */

function setStatus(text) {

    roomStatus.textContent =
        text;

}


function resetDisplay() {

    teamNodeElements.forEach(
        node => {

            node.classList.remove(
                "show",
                "pop"
            );

            node.style.display =
                "";

        }
    );

    pendingNode.classList.add("show");

    pendingNode.style.display =
        "";

}


function resetGameInputs() {

    allInputs.forEach(
        input => {

            input.value = "";

            input.disabled = true;

        }
    );

}


/* =========================================================
建立房間
========================================================= */

async function createRoom() {

    if (currentRoomCode) {

        alert(
            "你目前已經在房間內。\n請先退出目前房間。"
        );

        return;

    }


    createRoomBtn.disabled = true;

    joinRoomBtn.disabled = true;

    setStatus(
        "正在建立房間..."
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "create_nba_room",
                {
                    p_token:
                        playerToken
                }
            );


        if (error)
            throw error;


        currentRoomCode =
            data.room_code;

        myRole =
            data.role;

        gameState =
            data.state;


        updateRoomUI();

        subscribeToRoom();

        renderState();


        setStatus(
            "房間已建立，等待第二位玩家加入"
        );


    } catch(error) {

        console.error(error);

        alert(
            "建立房間失敗：\n" +
            error.message
        );

        createRoomBtn.disabled =
            false;

        joinRoomBtn.disabled =
            false;

        setStatus(
            "建立失敗"
        );

    }

}


/* =========================================================
加入房間
========================================================= */

async function joinRoom() {

    if (currentRoomCode) {

        alert(
            "你目前已經在房間內。\n請先退出目前房間。"
        );

        return;

    }


    const code =
        joinRoomInput.value
            .trim()
            .toUpperCase();


    if (code.length !== 6) {

        alert(
            "請輸入 6 位房間碼"
        );

        return;

    }


    createRoomBtn.disabled = true;

    joinRoomBtn.disabled = true;

    setStatus(
        "正在加入房間..."
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "join_nba_room",
                {
                    p_code:
                        code,

                    p_token:
                        playerToken
                }
            );


        if (error)
            throw error;


        currentRoomCode =
            data.room_code;

        myRole =
            data.role;

        gameState =
            data.state;


        updateRoomUI();

        subscribeToRoom();

        renderState();


        setStatus(
            gameState.player_count >= 2
                ? "房間已滿，遊戲開始！"
                : "已加入，等待其他玩家"
        );


    } catch(error) {

        console.error(error);

        alert(
            "加入房間失敗：\n" +
            error.message
        );

        createRoomBtn.disabled =
            false;

        joinRoomBtn.disabled =
            false;

        setStatus(
            "加入失敗"
        );

    }

}


/* =========================================================
房間 UI
========================================================= */

function updateRoomUI() {

    if (!currentRoomCode) {

        roomCode.textContent =
            "未加入";

        roleText.textContent =
            "請建立或加入房間";

        leaveRoomBtn.style.display =
            "none";

        createRoomBtn.disabled =
            false;

        joinRoomBtn.disabled =
            false;

        return;

    }


    roomCode.textContent =
        currentRoomCode;

    roleText.textContent =
        `你係 ${myRole}隊`;

    leaveRoomBtn.style.display =
        "block";

    createRoomBtn.disabled =
        true;

    joinRoomBtn.disabled =
        true;

}


/* =========================================================
Realtime
========================================================= */

function subscribeToRoom() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel =
            null;

    }


    if (!currentRoomCode)
        return;


    realtimeChannel =
        supabaseClient
            .channel(
                "nba-room-" +
                currentRoomCode
            )
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "nba_rooms",
                    filter:
                        `room_code=eq.${currentRoomCode}`
                },
                async payload => {

                    /*
                    房主退出後，
                    room 會被刪除。
                    */

                    if (
                        payload.eventType ===
                        "DELETE"
                    ) {

                        handleRoomClosed();

                        return;

                    }


                    if (
                        payload.new &&
                        payload.new.game_state
                    ) {

                        const incomingState =
                            payload.new.game_state;


                        /*
                        =========================================
                        核心修正：

                        如果收到新的 selected_team_index，
                        先播放動畫。

                        對面裝置以前係：
                        Realtime → renderState()
                        → 直接顯示結果

                        而家係：
                        Realtime → animateRoll()
                        → 顯示結果
                        =========================================
                        */

                        const incomingSelected =
                            incomingState
                                .selected_team_index;


                        const oldSelected =
                            gameState
                                ? gameState.selected_team_index
                                : null;


                        const hasNewTeam =
                            incomingSelected !== null &&
                            incomingSelected !== undefined &&
                            Number(incomingSelected) !==
                            Number(oldSelected);


                        if (
                            hasNewTeam &&
                            !isRolling &&
                            !animationPromise
                        ) {

                            const finalIndex =
                                Number(
                                    incomingSelected
                                );


                            animationPromise =
                                animateRoll(
                                    finalIndex
                                );


                            try {

                                await animationPromise;

                            } finally {

                                animationPromise =
                                    null;

                            }

                        }


                        gameState =
                            incomingState;


                        renderState();

                    }

                }
            )
            .subscribe(
                status => {

                    console.log(
                        "Realtime:",
                        status
                    );

                }
            );

}


/* =========================================================
房間被關閉
========================================================= */

function handleRoomClosed() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;

    }


    currentRoomCode =
        null;

    myRole =
        null;

    gameState =
        null;


    lastAnimatedTeamIndex =
        null;

    animationPromise =
        null;


    resetGameInputs();

    resetDisplay();


    roomCode.textContent =
        "未加入";

    roleText.textContent =
        "房間已結束";

    setStatus(
        "房間已關閉"
    );


    leaveRoomBtn.style.display =
        "none";

    createRoomBtn.disabled =
        false;

    joinRoomBtn.disabled =
        false;


    rollBtn.disabled =
        true;

    rollBtn.textContent =
        "請先建立或加入房間";


    createBtn.disabled =
        true;

    clearBtn.disabled =
        true;


    turnBanner.style.display =
        "none";

}


/* =========================================================
退出房間
========================================================= */

async function leaveRoom() {

    if (!currentRoomCode)
        return;


    const confirmed =
        confirm(
            "確定要退出房間嗎？"
        );


    if (!confirmed)
        return;


    leaveRoomBtn.disabled =
        true;


    try {

        const {
            error
        } =
            await supabaseClient.rpc(
                "leave_nba_room",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken
                }
            );


        if (error)
            throw error;


        if (realtimeChannel) {

            await supabaseClient.removeChannel(
                realtimeChannel
            );

            realtimeChannel =
                null;

        }


        currentRoomCode =
            null;

        myRole =
            null;

        gameState =
            null;


        lastAnimatedTeamIndex =
            null;

        animationPromise =
            null;


        resetGameInputs();

        resetDisplay();


        roomCode.textContent =
            "未加入";

        roleText.textContent =
            "請建立或加入房間";

        setStatus(
            "已退出房間"
        );


        turnBanner.style.display =
            "none";


        rollBtn.disabled =
            true;

        rollBtn.textContent =
            "請先建立或加入房間";


        createBtn.disabled =
            true;

        clearBtn.disabled =
            true;


        leaveRoomBtn.style.display =
            "none";


        createRoomBtn.disabled =
            false;

        joinRoomBtn.disabled =
            false;


    } catch(error) {

        console.error(error);

        alert(
            "退出房間失敗：\n" +
            error.message
        );

        leaveRoomBtn.disabled =
            false;

    }

}


/* =========================================================
重新取得房間
========================================================= */

async function refreshRoom() {

    if (
        !currentRoomCode
    )
        return;


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "get_nba_room",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken
                }
            );


        if (error)
            throw error;


        gameState =
            data.state;

        myRole =
            data.role;

        renderState();

    } catch(error) {

        console.error(error);

    }

}


/* =========================================================
Render
========================================================= */

function renderState() {

    if (!gameState) {

        resetGameInputs();

        resetDisplay();

        rollBtn.disabled =
            true;

        createBtn.disabled =
            true;

        return;

    }


    renderPlayers();

    updateTurnUI();

    updateButtons();

    updateTeamDisplay();


    createBtn.disabled =
        !(
            gameState.phase === "done" &&
            Number(
                gameState.completed_count
            ) >= 10
        );

}


/* =========================================================
玩家輸入
========================================================= */

function renderPlayers() {

    allInputs.forEach(
        input => {

            input.disabled = true;

            const parts =
                input.id.split("_");

            const team =
                parts[0];

            const position =
                parts[1];

            input.value =
                gameState[team]?.[position] ||
                "";

        }
    );


    /*
    未齊人：

    全部鎖死。
    */

    if (
        Number(
            gameState.player_count
        ) < 2
    ) {

        return;

    }


    /*
    不是 input：

    全部鎖死。
    */

    if (
        gameState.phase !== "input"
    ) {

        return;

    }


    /*
    未到自己：

    全部鎖死。
    */

    if (
        gameState.turn !== myRole
    ) {

        return;

    }


    const team =
        myRole.toLowerCase();


    ["pg","sg","sf","pf","c"]
        .forEach(
            position => {

                const input =
                    document.getElementById(
                        `${team}_${position}`
                    );


                if (
                    !gameState[
                        team
                    ][
                        position
                    ]
                ) {

                    input.disabled =
                        false;

                }

            }
        );

}


/* =========================================================
自動 Focus 下一格
========================================================= */

function focusNextAvailableInput() {

    if (!gameState)
        return;


    if (
        gameState.phase !== "input"
    )
        return;


    if (
        gameState.turn !== myRole
    )
        return;


    const team =
        myRole.toLowerCase();


    const positions =
        ["pg","sg","sf","pf","c"];


    for (
        const position of positions
    ) {

        const value =
            gameState[
                team
            ]?.[
                position
            ];


        if (!value) {

            const nextInput =
                document.getElementById(
                    `${team}_${position}`
                );


            if (
                nextInput &&
                !nextInput.disabled
            ) {

                setTimeout(
                    () => {

                        nextInput.focus();

                        try {

                            nextInput.scrollIntoView({
                                behavior: "smooth",
                                block: "center"
                            });

                        } catch(e) {}

                    },
                    80
                );

            }

            break;

        }

    }

}


/* =========================================================
輸入框
========================================================= */

allInputs.forEach(
    input => {

        input.addEventListener(
            "keydown",
            async event => {

                if (
                    event.key !== "Enter"
                )
                    return;


                event.preventDefault();


                await submitCurrentInput(
                    input
                );

            }
        );

    }
);


/* =========================================================
提交
========================================================= */

async function submitCurrentInput(
    input
) {

    if (!gameState)
        return;


    if (
        gameState.player_count < 2
    ) {

        alert(
            "請等待第二位玩家加入"
        );

        return;

    }


    if (
        gameState.phase !== "input"
    )
        return;


    if (
        gameState.turn !== myRole
    )
        return;


    const team =
        myRole.toLowerCase();


    if (
        !input.id.startsWith(
            team + "_"
        )
    )
        return;


    const position =
        input.id.split("_")[1];


    const name =
        input.value.trim();


    if (!name) {

        alert(
            "請輸入球員名字"
        );

        input.focus();

        return;

    }


    allInputs.forEach(
        x => x.disabled = true
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "fill_nba_player",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken,

                    p_position:
                        position,

                    p_player_name:
                        name
                }
            );


        if (error)
            throw error;


        gameState =
            data.state;


        renderState();


        /*
        =========================================
        核心修正：

        如果提交後仍然係自己回合，
        自動去下一個空位。
        =========================================
        */

        focusNextAvailableInput();


    } catch(error) {

        console.error(error);

        alert(
            error.message
        );

        await refreshRoom();

        focusNextAvailableInput();

    }

}


/* =========================================================
回合 UI
========================================================= */

function updateTurnUI() {

    if (!gameState) {

        turnBanner.style.display =
            "none";

        return;

    }


    turnBanner.style.display =
        "block";


    const count =
        Number(
            gameState.player_count
        );


    if (count < 2) {

        turnBanner.textContent =
            "⏳ 等待第二位玩家加入";

        return;

    }


    if (
        gameState.phase === "done"
    ) {

        turnBanner.textContent =
            "🏆 所有球員已完成，可以創建文案";

        return;

    }


    if (
        gameState.turn === myRole
    ) {

        if (
            gameState.phase === "roll"
        ) {

            turnBanner.textContent =
                `🟢 到你（${myRole}隊）！請隨機抽取球隊`;

        } else {

            turnBanner.textContent =
                `🟢 ${myRole}隊請輸入一名球員`;

        }

    } else {

        turnBanner.textContent =
            `🔴 現在是 ${gameState.turn}隊回合`;

    }

}


/* =========================================================
Buttons
========================================================= */

function updateButtons() {

    /*
    未齊兩人：

    所有遊戲按鈕灰色。
    */

    if (
        Number(
            gameState.player_count
        ) < 2
    ) {

        rollBtn.disabled =
            true;

        rollBtn.textContent =
            "等待第二位玩家";

        createBtn.disabled =
            true;

        clearBtn.disabled =
            true;

        return;

    }


    if (
        gameState.phase === "done"
    ) {

        rollBtn.disabled =
            true;

        rollBtn.textContent =
            "遊戲完成";

        return;

    }


    if (
        gameState.phase === "roll"
    ) {

        rollBtn.disabled =
            gameState.turn !== myRole;

        rollBtn.textContent =
            gameState.turn === myRole
                ? "隨機抽取球隊"
                : `等待 ${gameState.turn}隊`;

        return;

    }


    if (
        gameState.phase === "input"
    ) {

        const team =
            myRole.toLowerCase();


        const available =
            ["pg","sg","sf","pf","c"]
                .some(
                    position =>
                        !gameState[
                            team
                        ][
                            position
                        ]
                );


        rollBtn.disabled =
            !(
                gameState.turn === myRole &&
                available
            );


        rollBtn.textContent =
            "提交球員";

    }

}


/* =========================================================
球隊顯示
========================================================= */

function updateTeamDisplay() {

    const selected =
        gameState.selected_team_index;


    /*
    未抽球隊
    */

    if (
        selected === null ||
        selected === undefined
    ) {

        teamNodeElements.forEach(
            node => {

                node.classList.remove(
                    "show",
                    "pop"
                );

                node.style.display =
                    "";

            }
        );

        pendingNode.classList.add(
            "show"
        );

        pendingNode.style.display =
            "";

        return;

    }


    const index =
        Number(selected);


    if (
        !teamNodeElements[index]
    ) {

        return;

    }


    /*
    先明確移除 Pending
    */

    pendingNode.classList.remove(
        "show"
    );

    pendingNode.style.display =
        "none";


    teamNodeElements.forEach(
        node => {

            node.classList.remove(
                "show",
                "pop"
            );

        }
    );


    teamNodeElements[index]
        .classList.add(
            "show"
        );

}


/* =========================================================
抽籤
========================================================= */

async function startRolling() {

    if (isRolling)
        return;


    if (!gameState)
        return;


    if (
        Number(
            gameState.player_count
        ) < 2
    ) {

        return;

    }


    if (
        gameState.phase !== "roll"
    )
        return;


    if (
        gameState.turn !== myRole
    ) {

        alert(
            "未到你的回合"
        );

        return;

    }


    isRolling =
        true;


    rollBtn.disabled =
        true;


    displayCard.classList.add(
        "active"
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "roll_nba_room",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken
                }
            );


        if (error)
            throw error;


        const finalIndex =
            Number(
                data.state
                    .selected_team_index
            );


        /*
        =========================================
        房主自己抽：

        直接播放一次。

        Realtime 收到同一狀態時，
        因為 isRolling = true，
        不會再播放第二次。
        =========================================
        */

        await animateRoll(
            finalIndex
        );


        gameState =
            data.state;


        lastAnimatedTeamIndex =
            finalIndex;


        renderState();


    } catch(error) {

        console.error(error);

        alert(
            error.message
        );

        await refreshRoom();

    }


    isRolling =
        false;


    displayCard.classList.remove(
        "active"
    );


    renderState();

}


/* =========================================================
動畫
========================================================= */

function animateRoll(
    finalIndex
) {

    return new Promise(
        resolve => {

            let delay = 20;

            let count = 0;

            const maxSteps = 35;

            let lastIndex =
                activeNodeIndex;


            function step() {

                let index;


                if (
                    count ===
                    maxSteps - 1
                ) {

                    index =
                        finalIndex;

                } else {

                    do {

                        index =
                            Math.floor(
                                Math.random() * 30
                            );

                    } while (
                        index === lastIndex
                    );

                }


                teamNodeElements.forEach(
                    node => {

                        node.classList.remove(
                            "show",
                            "pop"
                        );

                    }
                );


                pendingNode.classList.remove(
                    "show"
                );

                pendingNode.style.display =
                    "none";


                const node =
                    teamNodeElements[index];


                node.classList.add(
                    "show"
                );


                node.classList.remove(
                    "pop"
                );


                void node.offsetWidth;


                node.classList.add(
                    "pop"
                );


                lastIndex =
                    index;

                activeNodeIndex =
                    index;


                count++;


                const remaining =
                    maxSteps - count;


                playTickSound(
                    remaining === 0
                );


                if (
                    remaining === 0
                ) {

                    resolve();

                    return;

                }


                if (remaining === 1)
                    delay = 550;

                else if (remaining === 2)
                    delay = 400;

                else if (remaining === 3)
                    delay = 280;

                else if (remaining === 4)
                    delay = 180;

                else if (remaining === 5)
                    delay = 110;

                else if (remaining <= 10)
                    delay += 10;


                setTimeout(
                    step,
                    delay
                );

            }


            step();

        }
    );

}


/* =========================================================
Roll button
========================================================= */

rollBtn.addEventListener(
    "click",
    async () => {

        if (!gameState)
            return;


        if (
            gameState.player_count < 2
        )
            return;


        if (
            gameState.phase === "roll"
        ) {

            await startRolling();

            return;

        }


        if (
            gameState.phase === "input"
        ) {

            if (
                gameState.turn !== myRole
            )
                return;


            const team =
                myRole.toLowerCase();


            const input =
                ["pg","sg","sf","pf","c"]
                    .map(
                        p =>
                            document.getElementById(
                                `${team}_${p}`
                            )
                    )
                    .find(
                        x =>
                            !x.disabled &&
                            x.value.trim()
                    );


            if (!input) {

                alert(
                    "請先輸入球員名字"
                );

                return;

            }


            await submitCurrentInput(
                input
            );

        }

    }
);


/* =========================================================
生成文案
========================================================= */

function generatePrompt() {

    if (
        !gameState ||
        gameState.phase !== "done"
    )
        return;


    const a =
        gameState.a;

    const b =
        gameState.b;


    outputText.value =

        `假設全員巔峯，請問 A隊 PG「${a.pg}」SG「${a.sg}」SF「${a.sf}」PF「${a.pf}」C「${a.c}」，同埋 B隊 PG「${b.pg}」SG「${b.sg}」SF「${b.sf}」PF「${b.pf}」C「${b.c}」，邊一隊更強？`;


    outputSection.style.display =
        "block";


    outputSection.scrollIntoView({
        behavior: "smooth"
    });


    hasCopiedPrompt =
        false;


    clearBtn.disabled =
        true;

}


/* =========================================================
Copy
========================================================= */

copyBtn.addEventListener(
    "click",
    async () => {

        if (!outputText.value)
            return;


        try {

            await navigator.clipboard.writeText(
                outputText.value
            );

            hasCopiedPrompt =
                true;

            clearBtn.disabled =
                false;

            alert(
                "文案已成功複製！"
            );

        } catch(error) {

            outputText.select();

            document.execCommand(
                "copy"
            );

            hasCopiedPrompt =
                true;

            clearBtn.disabled =
                false;

            alert(
                "文案已成功複製！"
            );

        }

    }
);


/* =========================================================
Clear
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        if (!hasCopiedPrompt)
            return;


        allInputs.forEach(
            input => {

                input.value = "";

                input.disabled = true;

            }
        );


        outputText.value = "";

        outputSection.style.display =
            "none";

        hasCopiedPrompt =
            false;

        clearBtn.disabled =
            true;

    }
);


/* =========================================================
建立 / 加入 / 退出
========================================================= */

createRoomBtn.addEventListener(
    "click",
    createRoom
);

joinRoomBtn.addEventListener(
    "click",
    joinRoom
);

leaveRoomBtn.addEventListener(
    "click",
    leaveRoom
);


/* =========================================================
URL ?room=XXXXXX
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const roomFromUrl =
    params.get("room");

if (roomFromUrl) {

    joinRoomInput.value =
        roomFromUrl
            .trim()
            .toUpperCase();

}


/* =========================================================
初始狀態
========================================================= */

resetGameInputs();

resetDisplay();

rollBtn.disabled =
    true;

createBtn.disabled =
    true;

clearBtn.disabled =
    true;

</script>
