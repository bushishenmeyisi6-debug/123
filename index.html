<!DOCTYPE html>
<html lang="zh-HK">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NBA 球隊隨機抽籤 & 陣容對決</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;
}


body {

    background: #f0f2f5;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 100vh;

    color: #333;

    padding: 20px 0;

}


.container {

    background: #fff;

    padding: 30px 25px;

    border-radius: 20px;

    box-shadow:
        0 15px 35px rgba(0,0,0,.1);

    text-align: center;

    width: 90%;

    max-width: 480px;

}


h1 {

    font-size: 1.3rem;

    color: #555;

    margin-bottom: 20px;

    letter-spacing: 1px;

}


/* =====================================================
   ROOM
===================================================== */

.room-section {

    background: #f8fafc;

    border: 1px solid #e2e8f0;

    border-radius: 14px;

    padding: 15px;

    margin-bottom: 20px;

}


.room-title {

    font-weight: 700;

    color: #334155;

    margin-bottom: 10px;

}


.room-code {

    font-size: 1.8rem;

    font-weight: 900;

    letter-spacing: 4px;

    color: #006bb6;

    margin: 8px 0;

}


.role-text {

    font-size: .95rem;

    color: #64748b;

    margin-bottom: 12px;

}


.room-actions {

    display: flex;

    gap: 8px;

}


.room-input {

    flex: 1;

    min-width: 0;

    padding: 10px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;

    outline: none;

    text-align: center;

    font-weight: 600;

    letter-spacing: 1px;

}


.room-btn {

    border: none;

    color: #fff;

    background: #006bb6;

    border-radius: 8px;

    padding: 10px 12px;

    font-weight: 700;

    cursor: pointer;

}


.room-btn:hover {

    background: #005a99;

}


.room-btn:disabled {

    background: #cbd5e1;

    cursor: not-allowed;

}


.status-text {

    margin-top: 10px;

    font-size: .9rem;

    color: #64748b;

}


/* =====================================================
   PLAYER COUNT
===================================================== */

.player-count {

    margin-top: 10px;

    font-size: .9rem;

    font-weight: 700;

    color: #64748b;

}


.player-count.ready {

    color: #10b981;

}


/* =====================================================
   TURN
===================================================== */

.turn-banner {

    display: none;

    margin-bottom: 15px;

    padding: 10px;

    border-radius: 10px;

    background: #eff6ff;

    color: #1d4ed8;

    font-weight: 700;

}


/* =====================================================
   DISPLAY
===================================================== */

.display-card {

    background: #fff;

    border: 2px solid #e2e8f0;

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;

    min-height: 230px;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;

    overflow: hidden;

    transition: .3s;

}


.display-card.locked {

    opacity: .5;

    filter: grayscale(1);

}


.display-card.active {

    border-color: #006bb6;

    box-shadow:
        0 0 15px rgba(0,107,182,.15);

}


.team-node {

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    width: 100%;

}


.team-node.show {

    display: flex;

}


.team-logo {

    width: 95px;

    height: 95px;

    margin-bottom: 12px;

    object-fit: contain;

}


.team-zh {

    font-size: 2.6rem;

    font-weight: 800;

    color: #1a202c;

    line-height: 1.1;

    margin-bottom: 6px;

}


.team-en {

    font-size: 1rem;

    color: #718096;

}


/* =====================================================
   PENDING
===================================================== */

.pending-node {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


.pending-node .team-logo {

    opacity: .35;

}


/* =====================================================
   ROLL BUTTON
===================================================== */

.btn-roll {

    background: #121212;

    color: #fff;

    border: none;

    padding: 14px 24px;

    font-size: 1.1rem;

    font-weight: 600;

    border-radius: 12px;

    cursor: pointer;

    width: 100%;

    box-shadow:
        0 4px 12px rgba(0,0,0,.15);

    margin-bottom: 12px;

}


.btn-roll:hover {

    background: #333;

}


.btn-roll:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

    box-shadow: none;

}


/* =====================================================
   LEAVE BUTTON
===================================================== */

.btn-leave {

    width: 100%;

    border: none;

    background: #fee2e2;

    color: #dc2626;

    padding: 10px;

    border-radius: 10px;

    font-weight: 700;

    cursor: pointer;

    margin-bottom: 25px;

}


.btn-leave:hover {

    background: #fecaca;

}


/* =====================================================
   DIVIDER
===================================================== */

.divider {

    height: 1px;

    background: #e2e8f0;

    margin: 10px 0 25px;

}


/* =====================================================
   TEAMS
===================================================== */

.teams-container {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 20px;

}


.team-box {

    flex: 1;

    background: #f8fafc;

    padding: 15px 10px;

    border-radius: 12px;

    border: 1px solid #edf2f7;

    transition: .2s;

}


.team-box.locked {

    opacity: .5;

}


.team-title {

    font-weight: 700;

    font-size: 1.1rem;

    color: #2d3748;

    margin-bottom: 15px;

}


.position-row {

    display: flex;

    align-items: center;

    margin-bottom: 10px;

}


.pos-label {

    width: 42px;

    text-align: right;

    font-weight: 700;

    font-size: .95rem;

    color: #4a5568;

    padding-right: 4px;

}


.player-input {

    flex: 1;

    padding: 6px 10px;

    border: 1px solid #cbd5e1;

    border-radius: 8px;

    font-size: .9rem;

    outline: none;

    width: 100%;

    background: #fff;

}


.player-input:focus {

    border-color: #006bb6;

    box-shadow:
        0 0 0 2px rgba(0,107,182,.15);

}


.player-input:disabled {

    background: #e9eef5;

    color: #94a3b8;

    cursor: not-allowed;

}


/* =====================================================
   ACTIONS
===================================================== */

.action-btns {

    display: flex;

    gap: 10px;

}


.btn-create {

    flex: 3;

    background: #10b981;

    color: #fff;

    border: none;

    padding: 14px 18px;

    font-size: 1.05rem;

    font-weight: 600;

    border-radius: 12px;

    cursor: pointer;

}


.btn-create:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

}


.btn-clear {

    flex: 1;

    background: #ef4444;

    color: #fff;

    border: none;

    padding: 14px 12px;

    font-size: 1rem;

    font-weight: 600;

    border-radius: 12px;

    cursor: pointer;

}


.btn-clear:disabled {

    background: #cbd5e1;

    color: #888;

    cursor: not-allowed;

}


/* =====================================================
   OUTPUT
===================================================== */

.output-section {

    margin-top: 20px;

    display: none;

    text-align: left;

    background: #f1f5f9;

    padding: 15px;

    border-radius: 12px;

    border: 1px solid #cbd5e1;

}


.output-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 8px;

}


.output-status {

    color: #10b981;

    font-weight: 700;

}


.btn-copy {

    background: #e2e8f0;

    color: #334155;

    border: none;

    padding: 4px 10px;

    font-size: .8rem;

    font-weight: 600;

    border-radius: 6px;

    cursor: pointer;

}


.output-text {

    width: 100%;

    height: 90px;

    border: none;

    background: transparent;

    font-size: .9rem;

    color: #334155;

    resize: none;

    outline: none;

    line-height: 1.4;

}


@media (max-width:420px) {

    .container {

        width:94%;

        padding:25px 15px;

    }

    .teams-container {

        gap:8px;

    }

    .team-box {

        padding:12px 6px;

    }

    .pos-label {

        width:38px;

        font-size:.85rem;

    }

    .player-input {

        font-size:.82rem;

        padding:6px 7px;

    }

}

</style>

</head>


<body>


<div class="container">

        <div class="team-title">

        <div class="position-row">
            <span class="pos-label">SG-</span>
            <input
                class="player-input"
                id="b_sg"

        </div>

        <div class="position-row">
            <span class="pos-label">SF-</span>
            <input
                class="player-input"
                id="b_sf"

        </div>

        <div class="position-row">
            <span class="pos-label">PF-</span>
            <input
                class="player-input"
                id="b_pf"
                disabled
            >
        </div>

        <div class="position-row">
            <span class="pos-label">C-</span>
            <input
                class="player-input"
                id="b_c"
                disabled
            >

</div>


<!-- =====================================================
     ACTIONS
===================================================== -->

<div class="action-btns">

    <button
        class="btn-create"

        創建球隊完成
    </button>

    <button

</div>


<!-- =====================================================

<div

    id="outputSection"
>

    <div class="output-header">

        <span class="output-status">
            已生成文案！

</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://yafuniflixhbkdcqnqfz.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ5YWZ1bmlmbGl4aGJrZGNxbmZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMjM0ODQsImV4cCI6MjEwMjc5OTQ4NH0.IBxTIxuHXDBT6OhyTtMxPsigZgx5oca7ZjFHS7h6Zyg";

const {
    createClient
} = window.supabase;

const supabaseClient =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   NBA TEAMS
========================================================= */

const nbaTeams = [

["老鷹","Atlanta Hawks","atl"],
["塞爾提克","Boston Celtics","bos"],
["籃網","Brooklyn Nets","bkn"],
["黃蜂","Charlotte Hornets","cha"],
["公牛","Chicago Bulls","chi"],
["騎士","Cleveland Cavaliers","cle"],
["獨行俠","Dallas Mavericks","dal"],
["金塊","Denver Nuggets","den"],
["活塞","Detroit Pistons","det"],
["勇士","Golden State Warriors","gs"],
["火箭","Houston Rockets","hou"],
["遛馬","Indiana Pacers","ind"],
["快艇","LA Clippers","lac"],
["湖人","Los Angeles Lakers","lal"],
["灰熊","Memphis Grizzlies","mem"],
["熱火","Miami Heat","mia"],
["公鹿","Milwaukee Bucks","mil"],
["灰狼","Minnesota Timberwolves","min"],
["鵜鶘","New Orleans Pelicans","no"],
["尼克","New York Knicks","ny"],
["雷霆","Oklahoma City Thunder","okc"],
["魔術","Orlando Magic","orl"],
["七六人","Philadelphia 76ers","phi"],
["太陽","Phoenix Suns","phx"],
["開拓者","Portland Trail Blazers","por"],
["國王","Sacramento Kings","sac"],
["馬刺","San Antonio Spurs","sas"],
["猛龍","Toronto Raptors","tor"],
["爵士","Utah Jazz","utah"],
["奇才","Washington Wizards","was"]

].map(t => ({

    zh: t[0],

    en: t[1],

    logo:
        `https://a.espncdn.com/i/teamlogos/nba/500/${t[2]}.png`

}));


/* =========================================================
   DOM
========================================================= */

const roomCode =
    document.getElementById("roomCode");

const roleText =
    document.getElementById("roleText");

const roomStatus =
    document.getElementById("roomStatus");

const playerCount =
    document.getElementById("playerCount");

const rollBtn =
    document.getElementById("rollBtn");

const displayCard =
    document.getElementById("displayCard");

const turnBanner =
    document.getElementById("turnBanner");

const teamBoxA =
    document.getElementById("teamBoxA");

const teamBoxB =
    document.getElementById("teamBoxB");

const createBtn =
    document.getElementById("createBtn");

const clearBtn =
    document.getElementById("clearBtn");

const leaveRoomBtn =
    document.getElementById("leaveRoomBtn");

const outputSection =
    document.getElementById("outputSection");

const outputText =
    document.getElementById("outputText");

const copyBtn =
    document.getElementById("copyBtn");


/* =========================================================
   TEAM DOM
========================================================= */

const teamNodes = [];


nbaTeams.forEach(
    (team, index) => {

        const node =
            document.createElement("div");

        node.className =
            "team-node";

        node.innerHTML = `

            <img
                src="${team.logo}"
                class="team-logo"
                alt="${team.en}"
            >

            <div class="team-zh">
                ${team.zh}
            </div>

            <div class="team-en">
                ${team.en}
            </div>

        `;

        displayCard.appendChild(node);

        teamNodes.push(node);

    }
);


/* =========================================================
   PLAYER IDENTITY
========================================================= */

let playerToken =
    localStorage.getItem(
        "nba_player_token"
    );


if (!playerToken) {

    playerToken =
        crypto.randomUUID();

    localStorage.setItem(
        "nba_player_token",
        playerToken
    );

}


let currentRoomCode =
    localStorage.getItem(
        "nba_room_code"
    );

let myRole =
    localStorage.getItem(
        "nba_my_role"
    );


let gameState = null;

let realtimeChannel = null;

let isRolling = false;


/* =========================================================
   UTILS
========================================================= */

function setStatus(text) {

    roomStatus.textContent =
        text;

}


function isPlaying() {

    return (
        gameState &&
        gameState.status === "playing"
    );

}


function isFull() {

    return (
        isPlaying()
    );

}


/* =========================================================
   ROOM UI
========================================================= */

function updateRoomUI() {

    if (!currentRoomCode) {

        roomCode.textContent =
            "未加入";

        roleText.textContent =
            "請建立或加入房間";

        playerCount.textContent =
            "0 / 2 人";

        leaveRoomBtn.style.display =
            "none";

        return;

    }


    roomCode.textContent =
        currentRoomCode;

    roleText.textContent =
        `你係 ${myRole}隊`;


    leaveRoomBtn.style.display =
        "block";

}


function updatePlayerCount() {

    if (!gameState) {

        playerCount.textContent =
            "1 / 2 人";

        playerCount.classList.remove(
            "ready"
        );

        return;

    }


    if (
        gameState.status ===
        "waiting"
    ) {

        playerCount.textContent =
            "1 / 2 人";

        playerCount.classList.remove(
            "ready"
        );

        return;

    }


    if (
        gameState.status ===
        "playing" ||
        gameState.status ===
        "done"
    ) {

        playerCount.textContent =
            "2 / 2 人";

        playerCount.classList.add(
            "ready"
        );

    }

}


/* =========================================================
   LOCK / UNLOCK
========================================================= */

function setGameLocked(
    locked
) {

    displayCard.classList.toggle(
        "locked",
        locked
    );

    teamBoxA.classList.toggle(
        "locked",
        locked
    );

    teamBoxB.classList.toggle(
        "locked",
        locked
    );

}


/* =========================================================
   CREATE ROOM
========================================================= */

async function createRoom() {

    if (currentRoomCode) {

        alert(
            "你已經在一個房間內"
        );

        return;

    }


    try {

        setStatus(
            "正在建立房間..."
        );


        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "create_nba_room",
                {
                    p_token:
                        playerToken
                }
            );


        if (error) {

            throw error;

        }


        currentRoomCode =
            data.room_code;

        myRole =
            data.role;

        gameState =
            data.state;


        localStorage.setItem(
            "nba_room_code",
            currentRoomCode
        );

        localStorage.setItem(
            "nba_my_role",
            myRole
        );


        updateRoomUI();

        subscribeToRoom();

        render();


        setStatus(
            "房間已建立，等待第二位玩家加入"
        );

    } catch (error) {

        console.error(error);

        setStatus(
            "建立失敗"
        );

        alert(
            "建立房間失敗：\n\n" +
            error.message
        );

    }

}


/* =========================================================
   JOIN ROOM
========================================================= */

async function joinRoom() {

    const input =
        document.getElementById(
            "joinRoomInput"
        );


    const code =
        input.value
            .trim()
            .toUpperCase();


    if (code.length !== 6) {

        alert(
            "請輸入 6 位房間碼"
        );

        return;

    }


    try {

        setStatus(
            "正在加入房間..."
        );


        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "join_nba_room",
                {
                    p_code: code,

                    p_token:
                        playerToken
                }
            );


        if (error) {

            throw error;

        }


        currentRoomCode =
            data.room_code;

        myRole =
            data.role;

        gameState =
            data.state;


        localStorage.setItem(
            "nba_room_code",
            currentRoomCode
        );

        localStorage.setItem(
            "nba_my_role",
            myRole
        );


        updateRoomUI();

        subscribeToRoom();

        render();


        if (
            gameState.status ===
            "playing"
        ) {

            setStatus(
                "已加入，2/2 人，遊戲開始！"
            );

        } else {

            setStatus(
                "已成功加入"
            );

        }

    } catch (error) {

        console.error(error);

        setStatus(
            "加入失敗"
        );

        alert(
            "加入房間失敗：\n\n" +
            error.message
        );

    }

}


/* =========================================================
   REALTIME
========================================================= */

function subscribeToRoom() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel = null;

    }


    if (!currentRoomCode) {

        return;

    }


    realtimeChannel =
        supabaseClient

            .channel(
                "nba-room-" +
                currentRoomCode
            )

            .on(
                "postgres_changes",
                {
                    event: "UPDATE",

                    schema: "public",

                    table: "nba_rooms",

                    filter:
                        `room_code=eq.${currentRoomCode}`

                },

                payload => {

                    if (
                        payload.new &&
                        payload.new.game_state
                    ) {

                        gameState =
                            payload.new.game_state;

                        render();

                    }

                }

            )

            .subscribe(
                status => {

                    console.log(
                        "Realtime:",
                        status
                    );

                }
            );

}


/* =========================================================
   REFRESH ROOM
========================================================= */

async function refreshRoom() {

    if (
        !currentRoomCode ||
        !playerToken
    ) {

        return;

    }


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "get_nba_room",
                {
                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken
                }
            );


        if (error) {

            throw error;

        }


        gameState =
            data.state;

        myRole =
            data.role;


        localStorage.setItem(
            "nba_my_role",
            myRole
        );


        updateRoomUI();

        render();

    } catch (error) {

        console.error(
            error
        );


        /*
        房間已經不存在。
        */

        if (
            error.message &&
            (
                error.message.includes(
                    "你不在此房間"
                ) ||
                error.message.includes(
                    "房間不存在"
                )
            )
        ) {

            resetLocalRoom();

        }

    }

}


/* =========================================================
   RENDER
========================================================= */

function render() {

    updateRoomUI();

    updatePlayerCount();


    if (!gameState) {

        setGameLocked(true);

        rollBtn.disabled = true;

        rollBtn.textContent =
            "請先建立或加入房間";

        createBtn.disabled = true;

        clearBtn.disabled = true;

        turnBanner.style.display =
            "none";

        return;

    }


    /* -----------------------------------------
       WAITING
    ----------------------------------------- */

    if (
        gameState.status ===
        "waiting"
    ) {

        setGameLocked(true);

        rollBtn.disabled =
            true;

        rollBtn.textContent =
            "等待第二位玩家加入";

        createBtn.disabled =
            true;

        clearBtn.disabled =
            true;


        turnBanner.style.display =
            "block";

        turnBanner.textContent =
            "⏳ 等待第二位玩家加入房間";


        showPending();

        renderPlayers();

        return;

    }


    /* -----------------------------------------
       PLAYING
    ----------------------------------------- */

    if (
        gameState.status ===
        "playing"
    ) {

        setGameLocked(false);

        renderPlayers();

        updateTurnUI();

        updateRollButton();

        updateTeamDisplay();

        createBtn.disabled =
            true;

        clearBtn.disabled =
            true;

        return;

    }


    /* -----------------------------------------
       DONE
    ----------------------------------------- */

    if (
        gameState.status ===
        "done"
    ) {

        setGameLocked(false);

        renderPlayers();

        updateTurnUI();

        updateTeamDisplay();

        rollBtn.disabled =
            true;

        rollBtn.textContent =
            "已完成";

        createBtn.disabled =
            false;

        return;

    }

}


/* =========================================================
   PENDING
========================================================= */

function showPending() {

    teamNodes.forEach(
        node => {

            node.classList.remove(
                "show"
            );

        }
    );


    document
        .getElementById(
            "node-pending"
        )
        .classList.add(
            "show"
        );

}


/* =========================================================
   TEAM DISPLAY
========================================================= */

function updateTeamDisplay() {

    const selected =
        gameState.selected_team_index;


    /*
    null = 下一輪 / 未抽
    */

    if (
        selected === null ||
        selected === undefined
    ) {

        showPending();

        return;

    }


    const index =
        Number(selected);


    if (
        !teamNodes[index]
    ) {

        showPending();

        return;

    }


    /*
    最重要：
    先將 pending 同所有其他球隊完全隱藏。
    */

    document
        .getElementById(
            "node-pending"
        )
        .classList.remove(
            "show"
        );


    teamNodes.forEach(
        node => {

            node.classList.remove(
                "show"
            );

        }
    );


    /*
    只顯示抽中的球隊。
    */

    teamNodes[index]
        .classList.add(
            "show"
        );

}


/* =========================================================
   PLAYERS
========================================================= */

function renderPlayers() {

    const positions = [
        "pg",
        "sg",
        "sf",
        "pf",
        "c"
    ];


    ["a","b"].forEach(
        team => {

            positions.forEach(
                position => {

                    const input =
                        document.getElementById(
                            `${team}_${position}`
                        );


                    input.value =
                        (
                            gameState[team] &&
                            gameState[team][position]
                        )
                        || "";


                    input.disabled =
                        true;

                }
            );

        }
    );


    /*
    未開始 / 完成
    */

    if (
        gameState.status !==
        "playing"
    ) {

        return;

    }


    /*
    唔係 input phase
    */

    if (
        gameState.phase !==
        "input"
    ) {

        return;

    }


    /*
    唔係自己回合
    */

    if (
        gameState.turn !==
        myRole
    ) {

        return;

    }


    const team =
        myRole.toLowerCase();


    positions.forEach(
        position => {

            const input =
                document.getElementById(
                    `${team}_${position}`
                );


            /*
            已填寫就鎖
            */

            if (
                !gameState[team][position]
            ) {

                input.disabled =
                    false;

            }

        }
    );

}


/* =========================================================
   TURN UI
========================================================= */

function updateTurnUI() {

    turnBanner.style.display =
        "block";


    if (
        gameState.status ===
        "done"
    ) {

        turnBanner.textContent =
            "🏆 全部 10 個位置已完成";

        return;

    }


    if (
        gameState.turn ===
        myRole
    ) {

        if (
            gameState.phase ===
            "roll"
        ) {

            turnBanner.textContent =
                `🟢 到你 (${myRole}隊)！請抽取球隊`;

        } else {

            turnBanner.textContent =
                `🟢 ${myRole}隊！請輸入一名球員`;

        }

    } else {

        turnBanner.textContent =
            `🔴 而家係 ${gameState.turn}隊回合，請等待`;

    }

}


/* =========================================================
   ROLL BUTTON
========================================================= */

function updateRollButton() {

    if (
        gameState.phase ===
        "roll"
    ) {

        rollBtn.textContent =
            "隨機抽取球隊";

        rollBtn.disabled =
            gameState.turn !==
            myRole;

        return;

    }


    if (
        gameState.phase ===
        "input"
    ) {

        const team =
            myRole.toLowerCase();


        const hasInput =
            [
                "pg",
                "sg",
                "sf",
                "pf",
                "c"
            ]
            .some(
                position =>
                    document.getElementById(
                        `${team}_${position}`
                    ).value.trim()
            );


        rollBtn.textContent =
            "提交球員";


        rollBtn.disabled =
            (
                gameState.turn !== myRole ||
                !hasInput
            );


        return;

    }


    rollBtn.disabled =
        true;

}


/* =========================================================
   INPUT EVENTS
========================================================= */

document
    .querySelectorAll(
        ".player-input"
    )
    .forEach(
        input => {

            input.addEventListener(
                "input",
                () => {

                    if (
                        gameState &&
                        gameState.phase ===
                        "input"
                    ) {

                        updateRollButton();

                    }

                }
            );


            input.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        event.preventDefault();

                        submitInput();

                    }

                }
            );

        }
    );


/* =========================================================
   SUBMIT PLAYER
========================================================= */

async function submitInput() {

    if (!gameState) {

        return;

    }


    if (
        gameState.phase !==
        "input"
    ) {

        return;

    }


    if (
        gameState.turn !==
        myRole
    ) {

        return;

    }


    const team =
        myRole.toLowerCase();


    const positions = [
        "pg",
        "sg",
        "sf",
        "pf",
        "c"
    ];


    /*
    找到目前玩家填寫嘅位置。
    */

    let selectedPosition =
        null;

    let selectedName =
        "";


    for (
        const position of positions
    ) {

        const input =
            document.getElementById(
                `${team}_${position}`
            );


        if (
            input.value.trim()
        ) {

            selectedPosition =
                position;

            selectedName =
                input.value.trim();

            break;

        }

    }


    if (
        !selectedPosition
    ) {

        alert(
            "請先輸入球員名字"
        );

        return;

    }


    /*
    禁止玩家一次填兩個。
    */

    const filledInputs =
        positions.filter(
            position =>
                document.getElementById(
                    `${team}_${position}`
                ).value.trim()
        );


    if (
        filledInputs.length > 1
    ) {

        alert(
            "每回合只可以輸入一名球員"
        );

        return;

    }


    rollBtn.disabled =
        true;


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "fill_nba_player",
                {

                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken,

                    p_position:
                        selectedPosition,

                    p_player_name:
                        selectedName

                }
            );


        if (error) {

            throw error;

        }


        gameState =
            data.state;


        render();

    } catch (error) {

        console.error(error);

        alert(
            "提交失敗：\n\n" +
            error.message
        );

        await refreshRoom();

    }

}


/* =========================================================
   ROLL
========================================================= */

async function startRolling() {

    if (
        isRolling ||
        !gameState
    ) {

        return;

    }


    if (
        gameState.status !==
        "playing"
    ) {

        return;

    }


    if (
        gameState.phase !==
        "roll"
    ) {

        return;

    }


    if (
        gameState.turn !==
        myRole
    ) {

        return;

    }


    isRolling =
        true;


    rollBtn.disabled =
        true;


    displayCard.classList.add(
        "active"
    );


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "roll_nba_room",
                {

                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken

                }
            );


        if (error) {

            throw error;

        }


        const finalIndex =
            Number(
                data.state
                    .selected_team_index
            );


        await animateRoll(
            finalIndex
        );


        gameState =
            data.state;


        render();

    } catch (error) {

        console.error(error);

        alert(
            "抽籤失敗：\n\n" +
            error.message
        );

        await refreshRoom();

    }


    isRolling =
        false;


    displayCard.classList.remove(
        "active"
    );


    render();

}


/* =========================================================
   ANIMATION
========================================================= */

function animateRoll(
    finalIndex
) {

    return new Promise(
        resolve => {

            let count = 0;

            const maxSteps =
                35;

            let delay = 25;


            function step() {

                let index;


                if (
                    count ===
                    maxSteps - 1
                ) {

                    index =
                        finalIndex;

                } else {

                    index =
                        Math.floor(
                            Math.random() *
                            nbaTeams.length
                        );

                }


                teamNodes.forEach(
                    node => {

                        node.classList.remove(
                            "show"
                        );

                    }
                );


                document
                    .getElementById(
                        "node-pending"
                    )
                    .classList.remove(
                        "show"
                    );


                teamNodes[index]
                    .classList.add(
                        "show"
                    );


                count++;


                if (
                    count >=
                    maxSteps
                ) {

                    resolve();

                    return;

                }


                if (
                    count > 28
                ) {

                    delay += 80;

                } else if (
                    count > 22
                ) {

                    delay += 40;

                } else {

                    delay += 2;

                }


                setTimeout(
                    step,
                    delay
                );

            }


            step();

        }
    );

}


/* =========================================================
   BUTTON
========================================================= */

rollBtn.addEventListener(
    "click",
    async () => {

        if (!gameState) {

            return;

        }


        if (
            gameState.phase ===
            "roll"
        ) {

            await startRolling();

            return;

        }


        if (
            gameState.phase ===
            "input"
        ) {

            await submitInput();

        }

    }
);


/* =========================================================
   CREATE PROMPT
========================================================= */

function generatePrompt() {

    if (
        !gameState ||
        gameState.status !==
        "done" ||
        Number(
            gameState.completed_count
        ) < 10
    ) {

        return;

    }


    const a =
        gameState.a;

    const b =
        gameState.b;


    outputText.value =

`假設全員巔峯，請問 A隊 PG「${a.pg}」 SG「${a.sg}」 SF「${a.sf}」 PF「${a.pf}」 C「${a.c}」，同埋 B隊 PG「${b.pg}」 SG「${b.sg}」 SF「${b.sf}」 PF「${b.pf}」 C「${b.c}」，邊一隊更強？`;


    outputSection.style.display =
        "block";


    outputSection.scrollIntoView({
        behavior: "smooth"
    });


    clearBtn.disabled =
        false;

}


/* =========================================================
   COPY
========================================================= */

copyBtn.addEventListener(
    "click",
    async () => {

        if (!outputText.value) {

            return;

        }


        try {

            await navigator.clipboard.writeText(
                outputText.value
            );


            alert(
                "文案已成功複製！"
            );

        } catch {

            outputText.select();

            document.execCommand(
                "copy"
            );

            alert(
                "文案已成功複製！"
            );

        }

    }
);


/* =========================================================
   CREATE BUTTON
========================================================= */

createBtn.addEventListener(
    "click",
    generatePrompt
);


/* =========================================================
   CLEAR
========================================================= */

clearBtn.addEventListener(
    "click",
    () => {

        if (
            !gameState ||
            gameState.status !==
            "done"
        ) {

            return;

        }


        outputText.value =
            "";

        outputSection.style.display =
            "none";

        clearBtn.disabled =
            true;

    }
);


/* =========================================================
   LEAVE ROOM
========================================================= */

async function leaveRoom() {

    if (!currentRoomCode) {

        return;

    }


    const confirmed =
        confirm(
            myRole === "A"
                ? "你係房主。\n退出後房間會關閉，確定退出？"
                : "確定退出房間？"
        );


    if (!confirmed) {

        return;

    }


    try {

        leaveRoomBtn.disabled =
            true;


        const {
            error
        } =
            await supabaseClient.rpc(
                "leave_nba_room",
                {

                    p_code:
                        currentRoomCode,

                    p_token:
                        playerToken

                }
            );


        if (error) {

            throw error;

        }


        resetLocalRoom();


        alert(
            "已退出房間"
        );

    } catch (error) {

        console.error(error);

        alert(
            "退出房間失敗：\n\n" +
            error.message
        );

        leaveRoomBtn.disabled =
            false;

    }

}


leaveRoomBtn.addEventListener(
    "click",
    leaveRoom
);


/* =========================================================
   RESET LOCAL ROOM
========================================================= */

function resetLocalRoom() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );

        realtimeChannel =
            null;

    }


    localStorage.removeItem(
        "nba_room_code"
    );

    localStorage.removeItem(
        "nba_my_role"
    );


    currentRoomCode =
        null;

    myRole =
        null;

    gameState =
        null;


    roomCode.textContent =
        "未加入";

    roleText.textContent =
        "請建立或加入房間";

    roomStatus.textContent =
        "尚未連接";

    playerCount.textContent =
        "0 / 2 人";


    turnBanner.style.display =
        "none";


    rollBtn.disabled =
        true;

    rollBtn.textContent =
        "請先建立或加入房間";


    createBtn.disabled =
        true;

    clearBtn.disabled =
        true;


    leaveRoomBtn.style.display =
        "none";


    outputSection.style.display =
        "none";


    document
        .querySelectorAll(
            ".player-input"
        )
        .forEach(
            input => {

                input.value =
                    "";

                input.disabled =
                    true;

            }
        );


    setGameLocked(true);

    showPending();

}


/* =========================================================
   CREATE ROOM BUTTON
========================================================= */

document
    .getElementById(
        "createRoomBtn"
    )
    .addEventListener(
        "click",
        createRoom
    );


/* =========================================================
   JOIN ROOM BUTTON
========================================================= */

document
    .getElementById(
        "joinRoomBtn"
    )
    .addEventListener(
        "click",
        joinRoom
    );


/* =========================================================
   URL ?room=XXXXXX
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const urlRoom =
    urlParams.get("room");


if (urlRoom) {

    document.getElementById(
        "joinRoomInput"
    ).value =
        urlRoom
            .trim()
            .toUpperCase();

}


/* =========================================================
   RESTORE
========================================================= */

(async function restoreRoom() {

    if (
        currentRoomCode &&
        playerToken
    ) {

        await refreshRoom();

        if (gameState) {

            updateRoomUI();

            subscribeToRoom();

            setStatus(
                gameState.status ===
                "playing"

                    ? "已重新連接遊戲"

                    : "已重新連接，等待第二位玩家"
            );

        }

    }

})();

</script>
